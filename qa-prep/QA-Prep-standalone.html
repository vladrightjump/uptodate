nassert.ok(await banner.isDisplayed(), 'Promo banner should be visible');"},"answer":"\u003cp>\u003cstrong>What it does:\u003c/strong> navigates to the page, looks for a single element matching the locator, and asserts that it is displayed. Setup → locate → assert. Note the difference between \u003cem>present in the DOM\u003c/em> and \u003cem>visible to the user\u003c/em>: \u003ccode>findElement\u003c/code> only proves the first; \u003ccode>isDisplayed()\u003c/code> is what proves the second. Elements can exist with \u003ccode>display:none\u003c/code>, zero size, or behind an overlay — a very common source of false passes.\u003c/p>\n\n\u003cp>\u003cstrong>What happens if the element can't be located\u003c/strong> — the important follow-up:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>findElement\u003c/code> throws \u003cstrong>\u003ccode>NoSuchElementException\u003c/code> / \u003ccode>NoSuchElementError\u003c/code>\u003c/strong> immediately (or after the implicit-wait timeout, if one is set). The assertion line never runs.\u003c/li>\n\u003cli>The test is reported as an \u003cstrong>error\u003c/strong>, not a clean assertion failure — the message is \"no such element: Unable to locate element\" rather than \"expected banner to be visible\". Less informative for whoever triages it.\u003c/li>\n\u003cli>Everything after it in the test is skipped; teardown still runs if \u003ccode>quit()\u003c/code> is in a \u003ccode>finally\u003c/code>/hook.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Why it might not be found\u003c/strong> — the triage list: the element genuinely isn't there (real bug); the page hasn't finished rendering yet (timing — the most common cause); the locator broke because the markup changed; the element is inside an \u003ccode>&lt;iframe&gt;\u003c/code> and you haven't switched to it; it's inside a shadow DOM; a different environment/feature flag/user role doesn't show it; or the app is on a different page than you assumed (redirect to login).\u003c/p>\n\n\u003cp>\u003cstrong>How I'd improve the script:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Use an \u003cstrong>explicit wait\u003c/strong> — \u003ccode>await driver.wait(until.elementLocated(By.css('#promo-banner')), 5000)\u003c/code> — so a slow render doesn't fail the test. Never mix implicit and explicit waits, and never use \u003ccode>sleep\u003c/code>.\u003c/li>\n\u003cli>To assert \u003cstrong>absence\u003c/strong>, don't use \u003ccode>findElement\u003c/code> inside a try/catch — use \u003ccode>findElements\u003c/code> (plural), which returns an empty array instead of throwing: \u003ccode>assert.equal((await driver.findElements(By.css('#promo-banner'))).length, 0)\u003c/code>.\u003c/li>\n\u003cli>Add a meaningful assertion message so a failure is self-explanatory in the CI log.\u003c/li>\n\u003cli>Move the locator into a Page Object; prefer \u003ccode>data-testid\u003c/code> over structural CSS/XPath.\u003c/li>\n\u003cli>Capture a screenshot on failure — makes triage a five-second job.\u003c/li>\n\u003c/ul>\n\n\u003cp>If the \"request\" they show is an HTTP call rather than a locator, describe it in the same way: method + endpoint + payload, the expected status code and response body, and what you'd verify (status, schema, values, authorisation, response time, and the resulting state in the database).\u003c/p>"},{"id":"c3","q":"Login task: which fields can be checked on the front end, which on the back end, and which would you verify twice (FE and BE)?","diff":"hard","tags":["test-design","security"],"answer":"\u003cp>The principle first: \u003cstrong>front-end validation exists for user experience; back-end validation exists for security and data integrity.\u003c/strong> Anything checked only on the client is not really checked — a user can bypass the UI entirely with curl or dev tools.\u003c/p>\n\n\u003cp>\u003cstrong>Front end only (UX, no security value):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Required-field prompts and inline \"please fill this in\" messages.\u003c/li>\n\u003cli>Email \u003cem>format\u003c/em> hints as you type, password strength meter, character counter.\u003c/li>\n\u003cli>Trimming whitespace, disabling the submit button until the form is complete, show/hide password toggle.\u003c/li>\n\u003cli>Purpose: instant feedback, fewer pointless round trips.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Back end only (the client cannot possibly do these):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Credential verification\u003c/strong> — does this password match the stored hash?\u003c/li>\n\u003cli>Account state: exists, active, locked, email verified, not deleted.\u003c/li>\n\u003cli>Authorisation and roles; what this user is allowed to see next.\u003c/li>\n\u003cli>Rate limiting / brute-force lockout; CAPTCHA verification.\u003c/li>\n\u003cli>Session and token issuance, expiry, invalidation on logout.\u003c/li>\n\u003cli>Duplicate-account checks against the database; audit logging.\u003c/li>\n\u003cli>Anything involving secrets or other users' data — never expose it to the client.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Verified twice (defence in depth) — the real answer to the question:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Required fields\u003c/strong> — client for speed, server because a crafted request can omit them.\u003c/li>\n\u003cli>\u003cstrong>Email format\u003c/strong> — client for feedback, server because a malformed address must never reach the database.\u003c/li>\n\u003cli>\u003cstrong>Length limits (min/max)\u003c/strong> — client to stop typing, server to prevent oversized payloads and buffer/DoS issues.\u003c/li>\n\u003cli>\u003cstrong>Character set / injection payloads\u003c/strong> — client filtering is a convenience; the server must sanitise and use parameterised queries. This is the classic one.\u003c/li>\n\u003cli>\u003cstrong>Any business rule\u003c/strong> (allowed domains, terms accepted) — both sides, and the two must agree.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>How I'd test it:\u003c/strong> do the normal UI pass, then bypass the UI — send the request directly from Postman with the fields empty, over-long, or containing \u003ccode>' OR '1'='1\u003c/code> and \u003ccode>&lt;script&gt;\u003c/code>, and confirm the server rejects it with a proper 400/401 rather than a 500 or, worse, a success. If the server accepts what the UI forbids, that's a finding regardless of how good the front end looks.\u003c/p>\n\u003cp>One more point worth making: the two layers must not \u003cem>contradict\u003c/em> each other — a front end that allows 8 characters while the server requires 10 produces an error the user can't understand.\u003c/p>"},{"id":"c4","q":"Payment task: if you were allowed only one test, which one would it be?","diff":"hard","tags":["test-design","risk"],"answer":"\u003cp>Pick the \u003cstrong>end-to-end happy path of a real payment, verified all the way to the money\u003c/strong>: a valid card, a real order, payment authorised, order confirmed in the UI \u003cem>and\u003c/em> recorded correctly in the database/payment provider, with the correct amount and currency.\u003c/p>\n\u003cp>\u003cstrong>Justify it by risk:\u003c/strong> if only one test can run, it has to cover the path that (a) every paying customer takes, (b) generates the revenue, and (c) touches the most components — UI, backend, payment gateway, database, confirmation email. It's the single test whose failure means \"stop the release\". A broken edge case costs some users; a broken happy path costs all of them.\u003c/p>\n\u003cp>\u003cstrong>Say what you're consciously giving up\u003c/strong> — that's what they're checking:\u003c/p>\n\u003cul>\n\u003cli>Declined cards, expired cards, insufficient funds.\u003c/li>\n\u003cli>Double-charging on double-click or refresh (the defect that hurts most, but it's second because it affects fewer users than a completely broken checkout).\u003c/li>\n\u003cli>3-D Secure / SCA challenge flows.\u003c/li>\n\u003cli>Refunds, partial payments, currency and rounding edge cases.\u003c/li>\n\u003cli>Timeout mid-transaction and reconciliation afterwards.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>A defensible alternative\u003c/strong>, and worth offering: if the happy path is already proven by production traffic, the one test becomes \u003cem>\"the customer is charged exactly once\"\u003c/em> — because a duplicate charge is the failure that costs money, trust and possibly a regulator's attention, and it's the one no user will forgive.\u003c/p>\n\u003cp>Finish by naming the assertion, not just the flow: not \"the confirmation page appeared\", but \"the amount charged equals the order total, exactly one transaction exists, and the order status is Paid\".\u003c/p>"},{"id":"c5","q":"In what direction would you choose to develop yourself further — manual, automation, or hybrid?","diff":"easy","tags":["soft-skills","career"],"answer":"\u003cp>\u003cstrong>Hybrid\u003c/strong> is the honest and the strongest answer — but only if you explain why rather than hedging.\u003c/p>\n\u003cp>The reasoning: automation without testing skill produces a large suite that checks the wrong things; manual skill without automation doesn't scale past a few releases. The valuable engineer decides \u003cem>what\u003c/em> is worth testing (risk analysis, test design, exploratory instinct) and then \u003cem>automates\u003c/em> the part that pays back. Those are two halves of one job.\u003c/p>\n\u003cp>Then get specific, because \"hybrid\" alone sounds like avoiding the question:\u003c/p>\n\u003cul>\n\u003cli>Where you're investing right now — e.g. \"deepening Playwright + TypeScript, and moving more coverage down from UI to API level.\"\u003c/li>\n\u003cli>What you're deliberately keeping sharp on the manual side — exploratory technique, risk-based test design, accessibility.\u003c/li>\n\u003cli>Where you want to be in 2–3 years — e.g. owning test strategy for a product, or QA lead, or SDET.\u003c/li>\n\u003c/ul>\n\u003cp>If the role is clearly one or the other, align with it honestly rather than giving a diplomatic non-answer — but keep the reasoning: \"primarily automation, while staying hands-on with exploratory testing, because that's what tells me which tests are worth automating.\"\u003c/p>"}]},{"id":"round-d","label":"Round D — Mobile Testing","desc":"Mobile-focused round: mobile-specific risks, a form to design tests for, compatibility","questions":[{"id":"d1","q":"What tests would you perform on mobile applications?","diff":"mid","tags":["mobile"],"answer":"\u003cp>Group them — a list of twenty random ideas sounds junior; six categories sound senior.\u003c/p>\n\u003cp>\u003cstrong>1. Functional\u003c/strong> — the features themselves: flows, business rules, validations, navigation, error handling, plus login/logout and session behaviour.\u003c/p>\n\u003cp>\u003cstrong>2. Installation & lifecycle\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Fresh install, \u003cstrong>upgrade over an existing version\u003c/strong> (does the user's data survive?), reinstall, uninstall (is data cleaned up?).\u003c/li>\n\u003cli>App killed by the OS in the background and resumed — state restored or gracefully restarted.\u003c/li>\n\u003cli>First launch, permission prompts, onboarding.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3. Interruptions\u003c/strong> — the classic mobile category:\u003c/p>\n\u003cul>\n\u003cli>Incoming call or SMS mid-flow; push notification; alarm; calendar reminder.\u003c/li>\n\u003cli>App backgrounded and returned to; device locked and unlocked; low battery / battery saver mode; low memory.\u003c/li>\n\u003cli>OS update, time-zone or clock change, device restart while a task is pending.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>4. Network\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>WiFi, 5G/4G/3G, and switching between them mid-request.\u003c/li>\n\u003cli>Offline behaviour: clear message, cached content, queued actions, sync when connectivity returns.\u003c/li>\n\u003cli>Slow and flaky connections, airplane mode, timeouts, captive-portal WiFi.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. Device & UI\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Screen sizes and densities, notch/safe areas, orientation change (does the form keep its input?), split screen / foldables.\u003c/li>\n\u003cli>Soft keyboard overlapping fields, correct keyboard type per field (email, numeric), autocorrect interference.\u003c/li>\n\u003cli>Gestures: tap, long press, swipe, pinch, scroll; touch-target size; back button (Android hardware/gesture back).\u003c/li>\n\u003cli>Dark mode, system font scaling, OS-level accessibility settings.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>6. Permissions\u003c/strong> — camera, location, contacts, notifications, storage: granted, denied, \"only this time\", revoked from settings while the app runs.\u003c/p>\n\u003cp>\u003cstrong>7. Non-functional\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Performance\u003c/strong> — cold/warm start time, scrolling smoothness, memory leaks over a long session.\u003c/li>\n\u003cli>\u003cstrong>Battery and data consumption\u003c/strong>; app size.\u003c/li>\n\u003cli>\u003cstrong>Security\u003c/strong> — no sensitive data in local storage or logs, certificate pinning, secure keychain, biometric login, screenshot/backgrounding privacy.\u003c/li>\n\u003cli>\u003cstrong>Compatibility\u003c/strong> across OS versions and devices; \u003cstrong>accessibility\u003c/strong> with TalkBack/VoiceOver.\u003c/li>\n\u003cli>\u003cstrong>Store readiness\u003c/strong> — deep links, push notifications, app store guidelines, versioning, crash reporting.\u003c/li>\n\u003c/ul>\n\u003cp>Mention tooling: real devices plus emulators (real devices for anything performance-, gesture- or network-related), device farms (BrowserStack/Sauce Labs), Appium/Espresso/XCUITest for automation, Charles Proxy for network manipulation, logcat/Xcode console for logs.\u003c/p>"},{"id":"d2","q":"You have a web application and a mobile application with the same core functionalities. What additional tests would you do on the mobile app?","diff":"mid","tags":["mobile","strategy"],"answer":"\u003cp>Start with the framing: \u003cstrong>the business logic is shared, so it doesn't need re-verifying from scratch\u003c/strong> — especially if both clients hit the same backend. The extra effort belongs to everything the mobile platform adds. Then list what's genuinely new:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Interruptions\u003c/strong> — calls, notifications, alarms, backgrounding, OS killing the app, device lock. No web equivalent.\u003c/li>\n\u003cli>\u003cstrong>Install / upgrade / uninstall\u003c/strong> — including upgrading over an old version with existing data, and the store build itself.\u003c/li>\n\u003cli>\u003cstrong>Offline and unreliable networks\u003c/strong> — mobile users lose connection constantly; web users mostly don't. Caching, queueing, sync, conflict handling.\u003c/li>\n\u003cli>\u003cstrong>Device permissions\u003c/strong> — camera, location, notifications, biometrics, and the denied/revoked paths.\u003c/li>\n\u003cli>\u003cstrong>Gestures and touch\u003c/strong> — swipe, long press, pinch, pull-to-refresh, touch-target size, no hover state (any web feature that depends on hover needs a mobile alternative).\u003c/li>\n\u003cli>\u003cstrong>Hardware/OS integration\u003c/strong> — Android back button and gesture navigation, share sheet, deep links, push notifications, biometric unlock, clipboard, camera/gallery.\u003c/li>\n\u003cli>\u003cstrong>Screen and layout\u003c/strong> — small viewports, notch/safe area, orientation change mid-form, split screen, foldables, system font scaling, dark mode.\u003c/li>\n\u003cli>\u003cstrong>Soft keyboard\u003c/strong> — covering the field being typed into, correct keyboard type, \"Next/Done\" behaviour, autocorrect mangling input.\u003c/li>\n\u003cli>\u003cstrong>Fragmentation\u003c/strong> — OS versions and device models, low-end hardware; the web equivalent (browsers) is far less varied.\u003c/li>\n\u003cli>\u003cstrong>Resources\u003c/strong> — battery drain, mobile-data usage, memory on low-end devices, cold start time, app size.\u003c/li>\n\u003cli>\u003cstrong>Mobile-specific security\u003c/strong> — data at rest on the device, logs, screenshots in the app switcher, jailbroken/rooted devices.\u003c/li>\n\u003cli>\u003cstrong>Version coexistence\u003c/strong> — unlike the web, users don't all update. An old app version must still work against the current API (backward compatibility), and force-update must work when it doesn't.\u003c/li>\n\u003c/ul>\n\u003cp>That last point is the one most candidates miss and it's a genuinely important difference: on the web everyone runs the latest version the moment you deploy; on mobile you support several versions at once.\u003c/p>\n\u003cp>Finish with the cross-client checks: data created on mobile appears correctly on web and vice versa, and the same account behaves consistently on both.\u003c/p>"},{"id":"d3","q":"What tests would you write for a form with: first name, last name, gender (optional radio buttons), date of birth (hardcoded), address, and Save / Cancel buttons?","diff":"mid","tags":["test-design"],"answer":"\u003cp>Work through it systematically — field by field, then the form as a whole.\u003c/p>\n\n\u003cp>\u003cstrong>Positive path\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>All fields filled correctly + Save → record saved, success message, correct data persisted (verify in the DB/API, not just the UI).\u003c/li>\n\u003cli>Only the mandatory fields filled (gender omitted, since it's optional) → still saves successfully.\u003c/li>\n\u003cli>Reopen the form → saved values are displayed correctly.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>First name / last name\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Required or not — empty submit shows the right error.\u003c/li>\n\u003cli>Boundary values on length: min−1, min, min+1, max, max+1; paste a 1000-character string.\u003c/li>\n\u003cli>Valid special cases that must be accepted: apostrophes (O'Brien), hyphens (Anne-Marie), spaces (van der Berg), accents and non-Latin characters (Иван, 李).\u003c/li>\n\u003cli>Invalid: digits, symbols, only spaces, leading/trailing spaces (trimmed?), emoji.\u003c/li>\n\u003cli>Injection payloads: \u003ccode>&lt;script&gt;alert(1)&lt;/script&gt;\u003c/code>, \u003ccode>' OR '1'='1\u003c/code> — must be stored/escaped safely, and must not execute when displayed back.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Gender (optional radio buttons)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>No option selected by default (it's optional) — and saving with none selected works.\u003c/li>\n\u003cli>Selecting an option works; only one can be selected at a time (that's the point of radios — if two can be selected, it's a checkbox bug).\u003c/li>\n\u003cli>Can the selection be cleared once made? Often it can't — decide whether that's intended and raise it if not.\u003c/li>\n\u003cli>Selected value is persisted and re-displayed correctly after reopening.\u003c/li>\n\u003cli>Keyboard: arrow keys move between options, the group is reachable by Tab as a single stop, the label text is clickable.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Date of birth (hardcoded / read-only)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Confirm it really is read-only: cannot be typed into, cannot be edited via dev tools \u003cem>and\u003c/em> — crucially — if the value is changed in the request payload, the \u003cstrong>server ignores or rejects it\u003c/strong>. A read-only field enforced only in the UI is a security finding.\u003c/li>\n\u003cli>Displayed in the correct format and locale (dd/mm/yyyy vs mm/dd/yyyy — 03/04 is ambiguous and a classic bug), correct time-zone handling so the date doesn't shift by a day.\u003c/li>\n\u003cli>The value is the correct one for that user, and any derived logic (age, eligibility) matches it.\u003c/li>\n\u003cli>Visually distinguishable as non-editable, and still announced correctly by a screen reader.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Address\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Structured or free text? If structured: street, number, city, postcode, country — each with its own validation. Postcode format per country is a common trap.\u003c/li>\n\u003cli>Long addresses, multi-line input, special characters, non-Latin scripts, apartment numbers like \"12/A\".\u003c/li>\n\u003cli>If there's autocomplete/lookup: selecting a suggestion fills the fields correctly, and a manual entry that isn't in the list is still accepted.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Buttons\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Save\u003c/strong> — enabled/disabled logic; disabled while submitting; double-click doesn't create two records; success and failure feedback; behaviour when the server returns an error (data not lost from the form).\u003c/li>\n\u003cli>\u003cstrong>Cancel\u003c/strong> — discards changes, doesn't save anything, returns to the previous screen; with unsaved changes it should warn (\"Discard changes?\") rather than silently losing them.\u003c/li>\n\u003cli>Cancel on an empty form; Save immediately after Cancel; navigating away with the browser back button.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Form-level\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Tab order is logical; Enter submits (or deliberately doesn't); focus moves to the first error on failed validation.\u003c/li>\n\u003cli>All errors shown at once vs one at a time; errors clear when the field is corrected.\u003c/li>\n\u003cli>Data persistence on refresh mid-edit; session timeout while the form is open — the user shouldn't lose everything silently.\u003c/li>\n\u003cli>Editing an existing record vs creating a new one; duplicate detection if relevant.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Non-functional\u003c/strong> — accessibility (every input has a label, errors announced, keyboard-only completion possible, contrast), responsive layout, browser compatibility, and the API-level checks: send the request directly with missing/oversized/invalid fields and confirm the server validates independently of the UI.\u003c/p>"},{"id":"d4","q":"What tests for that form should be performed if you open it on a mobile app?","diff":"mid","tags":["mobile","test-design"],"answer":"\u003cp>Everything from the web form still applies — plus the mobile layer:\u003c/p>\n\u003cp>\u003cstrong>Keyboard behaviour (the biggest source of real bugs here)\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>The soft keyboard must not cover the field being typed into — check the last fields on the form, especially Address and the Save button.\u003c/li>\n\u003cli>Correct keyboard type per field: text for names, and if the address has a numeric part, a numeric pad.\u003c/li>\n\u003cli>\"Next\" moves to the following field in the right order, \"Done\" dismisses or submits appropriately.\u003c/li>\n\u003cli>Autocorrect/autocapitalise doesn't mangle names; predictive text doesn't insert unwanted words.\u003c/li>\n\u003cli>Dismissing the keyboard by tapping outside doesn't lose input or trigger Cancel.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Layout and interaction\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Rotation mid-entry\u003c/strong> — entered values, radio selection and scroll position survive the orientation change. Losing input on rotate is a classic Android defect.\u003c/li>\n\u003cli>Small screens: fields not truncated, the read-only date of birth still fully readable, long address text wraps rather than clipping.\u003c/li>\n\u003cli>Touch targets — radio buttons and Save/Cancel large enough (≈44–48 dp) and not too close together; the label text is tappable, not just the tiny circle.\u003c/li>\n\u003cli>Scrolling with the keyboard open; the form scrolls rather than the page behind it; pull-to-refresh doesn't wipe the form.\u003c/li>\n\u003cli>Safe areas / notch, split screen, large system font sizes, dark mode.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Lifecycle and interruptions\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Incoming call or notification mid-form → returning to the app keeps the entered data.\u003c/li>\n\u003cli>App backgrounded and killed by the OS → is a draft restored, or at least is the loss handled gracefully with a warning?\u003c/li>\n\u003cli>Device lock/unlock, low-memory conditions, app switcher.\u003c/li>\n\u003cli>Android \u003cstrong>hardware/gesture back\u003c/strong> — treated like Cancel? Does it warn about unsaved changes? Doesn't silently discard data.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Network\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Save with no connection → clear error, form data preserved, retry possible (or queued and synced later).\u003c/li>\n\u003cli>Save on a slow connection → loading indicator, button disabled so it can't be tapped twice, no duplicate record when the request finally lands.\u003c/li>\n\u003cli>Connection lost \u003cem>during\u003c/em> the save — the crucial one: did it save or not? Verify no duplicate and no partial record.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Platform extras\u003c/strong> — paste from clipboard into the fields, native autofill (address/contact autofill), voice input, accessibility with TalkBack/VoiceOver (each field announced with its label, radio group announced as a group, the read-only field announced as read-only), and iOS vs Android behavioural differences.\u003c/p>"},{"id":"d5","q":"What are the types of compatibility testing?","diff":"mid","tags":["theory","compatibility"],"answer":"\u003cp>Compatibility testing checks that the software works across the environments it's meant to run in. The main split is \u003cstrong>backward vs forward\u003c/strong>, then by dimension.\u003c/p>\n\u003cp>\u003cstrong>By direction\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Backward compatibility\u003c/strong> — the new version still works with older environments, older data and older clients. E.g. a new API version still serves last year's mobile app; a new app version still opens files/settings saved by the previous one.\u003c/li>\n\u003cli>\u003cstrong>Forward compatibility\u003c/strong> — the current version keeps working with newer environments, e.g. the app survives the next OS release. Harder to test, usually done against beta OS builds.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>By dimension\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Browser\u003c/strong> — Chrome, Safari, Firefox, Edge; current and previous versions; rendering engines differ (Safari/WebKit is the usual offender).\u003c/li>\n\u003cli>\u003cstrong>Operating system\u003c/strong> — Windows/macOS/Linux; Android 12–15, iOS 16–18; the oldest version you officially support.\u003c/li>\n\u003cli>\u003cstrong>Device / hardware\u003c/strong> — phones, tablets, low-end vs flagship, foldables, different CPU/RAM, camera and sensor availability.\u003c/li>\n\u003cli>\u003cstrong>Screen\u003c/strong> — resolutions, aspect ratios, pixel density, orientation, notch/safe areas, split screen. (Often called \u003cem>responsive\u003c/em> testing.)\u003c/li>\n\u003cli>\u003cstrong>Network\u003c/strong> — WiFi, 5G/4G/3G, low bandwidth, high latency, VPN/proxy, captive portals.\u003c/li>\n\u003cli>\u003cstrong>Database\u003c/strong> — different DB engines or versions the product is certified against.\u003c/li>\n\u003cli>\u003cstrong>Software / third-party\u003c/strong> — coexistence with antivirus, ad blockers, password managers, browser extensions, other apps competing for resources.\u003c/li>\n\u003cli>\u003cstrong>Versions / data\u003c/strong> — app upgrade paths, data migration, API contract versioning between client and server.\u003c/li>\n\u003cli>\u003cstrong>Localisation\u003c/strong> — languages, character sets, right-to-left layouts, date/number/currency formats, time zones.\u003c/li>\n\u003cli>\u003cstrong>Accessibility tooling\u003c/strong> — behaves correctly with screen readers, magnification and OS font scaling.\u003c/li>\n\u003c/ul>\n\u003cp>Practical points to add: you can't test every combination, so you build a \u003cstrong>compatibility matrix\u003c/strong> from real analytics — the browsers/OS/devices your actual users have, prioritised by share — and cover the rest by risk. Device farms (BrowserStack, Sauce Labs, Firebase Test Lab) cover breadth; keep a few real devices for anything involving performance, gestures or network.\u003c/p>"}]}];</script>
<script>
/* QA Interview Prep — standalone app logic.
   Reads window.__ROUNDS__ (injected by scripts/build-standalone.mjs).
   No dependencies, no network. */
(function () {
  "use strict";

  var ROUNDS = window.__ROUNDS__ || [];
  var ALL = ROUNDS.reduce(function (acc, r) {
    return acc.concat(
      r.questions.map(function (q) {
        return { q: q, round: r };
      })
    );
  }, []);

  var LETTERS = ["A", "B", "C", "D", "E", "F", "G", "H"];
  var DIFF_LABEL = { easy: "Easy", mid: "Medium", hard: "Hard" };
  var DIFFS = ["all", "easy", "mid", "hard"];

  /* ------------------------------------------------------------- storage */

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem("qa-prep:" + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function save(key, value) {
    try {
      localStorage.setItem("qa-prep:" + key, JSON.stringify(value));
    } catch (e) {
      /* private mode — state still lives in memory */
    }
  }

  var state = {
    round: load("round", ROUNDS[0] && ROUNDS[0].id),
    known: new Set(load("known", [])),
    open: new Set(load("open", [])),
    query: "",
    diff: "all",
    hideKnown: false,
    night: load("night", false),
  };

  function persistSets() {
    save("known", Array.from(state.known));
    save("open", Array.from(state.open));
  }

  /* --------------------------------------------------------------- utils */

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function plain(q) {
    var sol = (q.solution || [])
      .map(function (s) {
        return s.src;
      })
      .join(" ");
    return (
      q.q +
      " " +
      (q.tags || []).join(" ") +
      " " +
      (q.prompt ? q.prompt.src : "") +
      " " +
      q.answer.replace(/<[^>]+>/g, " ") +
      " " +
      sol
    ).toLowerCase();
  }

  ALL.forEach(function (item) {
    item.text = plain(item.q);
  });

  function roundById(id) {
    for (var i = 0; i < ROUNDS.length; i++) {
      if (ROUNDS[i].id === id) return ROUNDS[i];
    }
    return ROUNDS[0];
  }

  function visible() {
    var q = state.query.trim().toLowerCase();
    var pool = q
      ? ALL
      : ALL.filter(function (it) {
          return it.round.id === state.round;
        });

    return pool.filter(function (it) {
      if (state.diff !== "all" && it.q.diff !== state.diff) return false;
      if (state.hideKnown && state.known.has(it.q.id)) return false;
      if (q && it.text.indexOf(q) === -1) return false;
      return true;
    });
  }

  /* ------------------------------------------------------------ rendering */

  function figure(block, kind) {
    return (
      '<figure class="fig">' +
      '<figcaption class="fig-cap">' +
      '<span class="label">' +
      esc(block.lang) +
      "</span>" +
      (block.caption ? '<span class="note">' + esc(block.caption) + "</span>" : "") +
      '<button class="copy" data-copy="' +
      esc(block.src) +
      '">' +
      (kind === "prompt" ? "copy" : "copy") +
      "</button>" +
      "</figcaption>" +
      "<pre><code>" +
      esc(block.src) +
      "</code></pre>" +
      "</figure>"
    );
  }

  function dataTable(t) {
    return (
      '<figure class="fig">' +
      (t.caption
        ? '<figcaption class="fig-cap"><span class="note">' +
          esc(t.caption) +
          "</span></figcaption>"
        : "") +
      '<table class="data"><thead><tr>' +
      t.columns
        .map(function (c) {
          return "<th>" + esc(c) + "</th>";
        })
        .join("") +
      "</tr></thead><tbody>" +
      t.rows
        .map(function (row) {
          return (
            "<tr>" +
            row
              .map(function (cell) {
                return "<td>" + esc(cell) + "</td>";
              })
              .join("") +
            "</tr>"
          );
        })
        .join("") +
      "</tbody></table></figure>"
    );
  }

  function entryHtml(item, n, showRound) {
    var q = item.q;
    var isOpen = state.open.has(q.id);
    var isKnown = state.known.has(q.id);
    var tags = (q.tags || [])
      .map(function (t) {
        return "<span>" + esc(t) + "</span>";
      })
      .join("");

    var body = "";
    if (isOpen) {
      body =
        '<div class="entry-body">' +
        (q.table ? dataTable(q.table) : "") +
        (q.prompt ? figure(q.prompt, "prompt") : "") +
        '<div class="prose">' +
        q.answer +
        "</div>" +
        (q.solution || [])
          .map(function (b) {
            return figure(b, "solution");
          })
          .join("") +
        "</div>" +
        '<div class="entry-foot">' +
        '<button class="mark' +
        (isKnown ? " is-on" : "") +
        '" data-mark="' +
        q.id +
        '">' +
        (isKnown ? "✓ known" : "mark as known") +
        "</button>" +
        "</div>";
    }

    return (
      '<li class="entry' +
      (isKnown ? " is-known" : "") +
      '" id="q-' +
      q.id +
      '">' +
      (showRound
        ? '<p class="result-of">' + esc(item.round.label) + "</p>"
        : "") +
      '<button class="entry-head" data-open="' +
      q.id +
      '" aria-expanded="' +
      isOpen +
      '">' +
      '<span class="entry-num">' +
      n +
      ".</span>" +
      '<span class="entry-main">' +
      '<span class="entry-q">' +
      esc(q.q) +
      "</span>" +
      '<span class="entry-meta">' +
      '<span class="diff diff-' +
      q.diff +
      '">' +
      DIFF_LABEL[q.diff] +
      "</span>" +
      tags +
      (isKnown ? "<span>✓ known</span>" : "") +
      '<span class="entry-cue">' +
      (isOpen ? "hide answer" : "answer it out loud first, then reveal") +
      "</span>" +
      "</span>" +
      "</span>" +
      "</button>" +
      body +
      "</li>"
    );
  }

  function renderContents() {
    var el = document.getElementById("toc");
    el.innerHTML = ROUNDS.map(function (r, i) {
      var done = r.questions.filter(function (q) {
        return state.known.has(q.id);
      }).length;
      var pct = Math.round((done / r.questions.length) * 100);
      var name = r.label.replace(/^Round [A-Z]\s*—\s*/, "");
      return (
        "<li>" +
        '<button class="toc-item" data-round="' +
        r.id +
        '" aria-current="' +
        (r.id === state.round && !state.query.trim()) +
        '">' +
        '<span class="toc-line">' +
        '<span class="toc-letter">' +
        LETTERS[i] +
        "</span>" +
        '<span class="toc-name">' +
        esc(name) +
        "</span>" +
        '<span class="toc-count">' +
        done +
        "/" +
        r.questions.length +
        "</span>" +
        "</span>" +
        '<span class="toc-rule"><span style="width:' +
        pct +
        '%"></span></span>' +
        "</button>" +
        "</li>"
      );
    }).join("");

    document.getElementById("tally").innerHTML =
      "<b>" +
      state.known.size +
      "</b> of <b>" +
      ALL.length +
      "</b> marked known" +
      (state.known.size
        ? ' &middot; <button id="reset">reset</button>'
        : "");
  }

  function renderMain() {
    var searching = state.query.trim().length > 0;
    var items = visible();
    var round = roundById(state.round);
    var head = document.getElementById("round-head");
    var list = document.getElementById("entries");

    if (searching) {
      head.innerHTML =
        '<span class="kicker">Search</span>' +
        "<h2>“" +
        esc(state.query.trim()) +
        "”</h2>" +
        "<p>" +
        items.length +
        (items.length === 1 ? " question" : " questions") +
        " across all four rounds.</p>";
    } else {
      var i = ROUNDS.indexOf(round);
      head.innerHTML =
        '<span class="kicker">Round ' +
        LETTERS[i] +
        " &middot; " +
        round.questions.length +
        " questions</span>" +
        "<h2>" +
        esc(round.label.replace(/^Round [A-Z]\s*—\s*/, "")) +
        "</h2>" +
        "<p>" +
        esc(round.desc) +
        "</p>";
    }

    if (!items.length) {
      list.innerHTML =
        '<li class="empty">Nothing here under those filters. Clear the search, or set difficulty back to all.</li>';
      return;
    }

    list.innerHTML = items
      .map(function (item, n) {
        return entryHtml(item, n + 1, searching);
      })
      .join("");
  }

  function render() {
    renderContents();
    renderMain();
    DIFFS.forEach(function (d) {
      var b = document.querySelector('[data-diff="' + d + '"]');
      if (b) b.setAttribute("aria-pressed", String(state.diff === d));
    });
    var hk = document.getElementById("hide-known");
    hk.classList.toggle("is-on", state.hideKnown);
    var anyClosed = visible().some(function (it) {
      return !state.open.has(it.q.id);
    });
    document.getElementById("expand").textContent = anyClosed
      ? "expand all"
      : "collapse all";
  }

  /* --------------------------------------------------------------- events */

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-mark],[data-round],[data-copy]");
    if (!t) return;

    if (t.hasAttribute("data-copy")) {
      var text = t.getAttribute("data-copy");
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () {
          t.textContent = "copied";
          setTimeout(function () {
            t.textContent = "copy";
          }, 1400);
        });
      }
      return;
    }

    if (t.hasAttribute("data-round")) {
      state.round = t.getAttribute("data-round");
      state.query = "";
      document.getElementById("search").value = "";
      save("round", state.round);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.hasAttribute("data-mark")) {
      var mid = t.getAttribute("data-mark");
      if (state.known.has(mid)) state.known.delete(mid);
      else state.known.add(mid);
      persistSets();
      render();
      return;
    }

    var id = t.getAttribute("data-open");
    if (state.open.has(id)) state.open.delete(id);
    else state.open.add(id);
    persistSets();
    render();
  });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });

  DIFFS.forEach(function (d) {
    document
      .querySelector('[data-diff="' + d + '"]')
      .addEventListener("click", function () {
        state.diff = d;
        render();
      });
  });

  document.getElementById("hide-known").addEventListener("click", function () {
    state.hideKnown = !state.hideKnown;
    render();
  });

  document.getElementById("expand").addEventListener("click", function () {
    var items = visible();
    var anyClosed = items.some(function (it) {
      return !state.open.has(it.q.id);
    });
    items.forEach(function (it) {
      if (anyClosed) state.open.add(it.q.id);
      else state.open.delete(it.q.id);
    });
    persistSets();
    render();
  });

  var nightBtn = document.getElementById("night");
  function applyNight() {
    document.documentElement.setAttribute(
      "data-night",
      state.night ? "on" : "off"
    );
    nightBtn.classList.toggle("is-on", state.night);
    nightBtn.textContent = state.night ? "day" : "night";
  }
  nightBtn.addEventListener("click", function () {
    state.night = !state.night;
    save("night", state.night);
    applyNight();
  });

  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "reset") {
      state.known.clear();
      persistSets();
      render();
    }
  });

  document.addEventListener("keydown", function (e) {
    var typing =
      e.target &&
      (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");

    if (e.key === "/" && !typing) {
      e.preventDefault();
      document.getElementById("search").focus();
      return;
    }
    if (e.key === "Escape" && typing) {
      e.target.value = "";
      state.query = "";
      e.target.blur();
      render();
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key >= "1" && e.key <= String(ROUNDS.length)) {
      state.round = ROUNDS[Number(e.key) - 1].id;
      state.query = "";
      document.getElementById("search").value = "";
      save("round", state.round);
      render();
      window.scrollTo({ top: 0 });
    } else if (e.key === "e") {
      document.getElementById("expand").click();
    } else if (e.key === "n") {
      nightBtn.click();
    }
  });

  /* Printing: an answer only exists in the DOM while it is open, so expand
     everything for the print run and put the reading state back afterwards. */
  var printBackup = null;
  window.addEventListener("beforeprint", function () {
    printBackup = new Set(state.open);
    ALL.forEach(function (it) {
      state.open.add(it.q.id);
    });
    renderMain();
  });
  window.addEventListener("afterprint", function () {
    if (!printBackup) return;
    state.open = printBackup;
    printBackup = null;
    render();
  });

  applyNight();
  render();
})();

</script>
</body>
</html>
