<!doctype html>
<html lang="en" data-night="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Interview Prep</title>
<meta name="description" content="41 QA interview questions in four rounds, with model answers.">
<style>
/* ==========================================================================
   QA Interview Prep — editorial study guide
   Self-contained stylesheet for the standalone build. System fonts only, so
   the file works offline with nothing to download.
   ========================================================================== */

:root {
  --paper: #fbf9f4;
  --paper-2: #f4f0e7;
  --paper-3: #ece6d9;
  --ink: #1f1c17;
  --ink-2: #565047;
  --ink-3: #8b8478;
  --rule: #ded6c6;
  --rule-soft: #ebe4d6;
  --accent: #9a3b25;
  --accent-soft: #f3e4de;
  --known: #4c6b46;
  --known-soft: #e6ede2;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
    "Hoefler Text", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;

  --measure: 36rem;
  color-scheme: light;
}

html[data-night="on"] {
  --paper: #17150f;
  --paper-2: #1e1b15;
  --paper-3: #262219;
  --ink: #ece5d6;
  --ink-2: #b3aa98;
  --ink-3: #857d6d;
  --rule: #342f24;
  --rule-soft: #2a261d;
  --accent: #d9765c;
  --accent-soft: #3a2119;
  --known: #8fb083;
  --known-soft: #23301f;
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 var(--serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input {
  font: inherit;
  color: inherit;
}

::selection {
  background: var(--accent-soft);
}

:focus-visible {
  outline: 1.5px solid var(--accent);
  outline-offset: 3px;
}

.kicker {
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------------------------------------------------------------- masthead */

.masthead {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--ink);
  box-shadow: 0 2px 0 var(--paper), 0 3px 0 var(--rule);
}

.masthead-inner {
  display: flex;
  align-items: flex-end;
  gap: 22px;
  max-width: 62rem;
  margin: 0 auto;
  padding: 14px 32px 12px;
}

.logo {
  flex: none;
}

.logo h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  line-height: 1;
}

.logo p {
  margin: 5px 0 0;
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.02em;
}

.masthead-tools {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 14px 18px;
  align-items: center;
  justify-content: flex-end;
}

.field {
  position: relative;
  flex: 0 1 190px;
}

.field input {
  width: 100%;
  padding: 4px 2px 5px 18px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 13px;
}

.field input:focus {
  border-bottom-color: var(--accent);
  outline: none;
}

.field input::placeholder {
  color: var(--ink-3);
}

.field::before {
  content: "⌕";
  position: absolute;
  left: 0;
  top: 3px;
  color: var(--ink-3);
  font-size: 14px;
}

.tool-group {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--sans);
  font-size: 11px;
}

.tool-group .kicker {
  font-size: 9.5px;
}

.tool {
  padding: 2px 1px;
  background: none;
  border: 0;
  border-bottom: 1.5px solid transparent;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 11.5px;
  letter-spacing: 0.02em;
  cursor: pointer;
}

.tool:hover {
  color: var(--ink);
}

.tool[aria-pressed="true"],
.tool.is-on {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* --------------------------------------------------------------- structure */

.wrap {
  display: grid;
  grid-template-columns: 15rem minmax(0, 1fr);
  gap: 56px;
  max-width: 62rem;
  margin: 0 auto;
  padding: 44px 32px 120px;
}

/* ---------------------------------------------------------------- contents */

.contents {
  position: sticky;
  top: 96px;
  align-self: start;
}

.contents > .kicker {
  display: block;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--ink);
}

.contents ol {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: toc;
}

.contents li {
  border-bottom: 1px solid var(--rule-soft);
}

.toc-item {
  display: block;
  width: 100%;
  padding: 12px 0 11px;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.toc-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.toc-letter {
  flex: none;
  width: 1.1em;
  color: var(--accent);
  font-size: 13px;
  font-style: italic;
}

.toc-name {
  flex: 1;
  font-size: 14.5px;
  line-height: 1.35;
}

.toc-item[aria-current="true"] .toc-name {
  font-weight: 600;
}

.toc-count {
  flex: none;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
}

.toc-rule {
  display: block;
  height: 2px;
  margin: 8px 0 0 calc(1.1em + 8px);
  background: var(--rule-soft);
}

.toc-rule span {
  display: block;
  height: 100%;
  background: var(--known);
  transition: width 0.3s ease;
}

.contents-foot {
  margin-top: 20px;
  font-family: var(--sans);
  font-size: 11px;
  line-height: 1.7;
  color: var(--ink-3);
}

.contents-foot b {
  color: var(--ink-2);
  font-weight: 600;
}

.contents-foot button {
  padding: 0;
  background: none;
  border: 0;
  color: var(--accent);
  font-family: var(--sans);
  font-size: 11px;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.keys {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--sans);
  font-size: 10.5px;
  line-height: 2;
  color: var(--ink-3);
}

.keys kbd {
  display: inline-block;
  min-width: 15px;
  padding: 1px 4px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 9.5px;
  text-align: center;
}

/* ------------------------------------------------------------ round header */

.round-head {
  margin-bottom: 34px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--ink);
}

.round-head .kicker {
  display: block;
  margin-bottom: 10px;
}

.round-head h2 {
  max-width: var(--measure);
  margin: 0;
  font-size: 33px;
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -0.015em;
}

.round-head p {
  max-width: var(--measure);
  margin: 10px 0 0;
  font-size: 16px;
  font-style: italic;
  color: var(--ink-2);
}

/* -------------------------------------------------------------- the entries */

.entries {
  margin: 0;
  padding: 0;
  list-style: none;
}

.entry {
  padding: 26px 0 24px;
  border-bottom: 1px solid var(--rule-soft);
}

.entry:first-child {
  padding-top: 0;
}

.entry-head {
  display: flex;
  gap: 20px;
  width: 100%;
  padding: 0;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.entry-num {
  flex: none;
  width: 2.4rem;
  padding-top: 3px;
  color: var(--accent);
  font-size: 15px;
  font-style: italic;
  font-variant-numeric: lining-nums;
  text-align: right;
}

.entry-main {
  display: block;
  flex: 1;
  min-width: 0;
}

.entry-q {
  display: block;
  max-width: var(--measure);
  margin: 0;
  font-size: 20px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: -0.005em;
  text-wrap: pretty;
}

.entry.is-known .entry-q {
  color: var(--ink-2);
}

.entry-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 9px;
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.entry-meta .diff {
  color: var(--ink-2);
  font-weight: 600;
}

.entry-meta .diff::before {
  content: "";
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: 1px;
  background: currentColor;
}

.diff-easy::before {
  background: var(--known) !important;
}
.diff-mid::before {
  background: #b9822d !important;
}
.diff-hard::before {
  background: var(--accent) !important;
}

.entry-cue {
  margin-left: auto;
  font-style: italic;
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink-3);
}

.entry-body {
  padding: 4px 0 0 calc(2.4rem + 20px);
}

.entry-foot {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 22px;
  padding-left: calc(2.4rem + 20px);
}

.mark {
  padding: 4px 12px 5px;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 2px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
  cursor: pointer;
}

.mark:hover {
  border-color: var(--ink-3);
}

.mark.is-on {
  background: var(--known-soft);
  border-color: var(--known);
  color: var(--known);
}

/* ------------------------------------------------------------------- prose */

.prose {
  max-width: var(--measure);
  font-size: 16.5px;
  line-height: 1.72;
}

.prose > *:first-child {
  margin-top: 14px;
}

.prose p {
  margin: 0 0 14px;
  text-wrap: pretty;
}

.prose ul,
.prose ol {
  margin: 0 0 14px;
  padding-left: 1.3em;
}

.prose ul {
  list-style: none;
  padding-left: 1.1em;
}

.prose ul > li::before {
  content: "—";
  position: absolute;
  margin-left: -1.1em;
  color: var(--ink-3);
}

.prose li {
  position: relative;
  margin: 0 0 7px;
}

.prose li > ul,
.prose li > ol {
  margin: 6px 0 4px;
}

.prose ol > li::marker {
  color: var(--accent);
  font-style: italic;
  font-size: 0.85em;
}

.prose strong {
  font-weight: 600;
}

.prose em {
  color: var(--ink-2);
}

.prose code {
  padding: 0 3px;
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 0.82em;
  white-space: nowrap;
}

.prose pre {
  margin: 0 0 16px;
  padding: 14px 16px;
  background: var(--paper-2);
  border-left: 2px solid var(--rule);
  overflow-x: auto;
}

.prose pre code {
  padding: 0;
  background: none;
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre;
}

/* comparison table inside an answer */
.prose table.cmp {
  width: 100%;
  margin: 6px 0 18px;
  border-collapse: collapse;
  font-size: 14px;
  line-height: 1.5;
}

.prose table.cmp th,
.prose table.cmp td {
  padding: 8px 12px 8px 0;
  border-bottom: 1px solid var(--rule-soft);
  text-align: left;
  vertical-align: top;
}

.prose table.cmp thead th {
  border-bottom: 1px solid var(--ink);
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.prose table.cmp tbody th {
  width: 8.5rem;
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.03em;
}

/* ------------------------------------------------- figures: tables & code */

.fig {
  max-width: var(--measure);
  margin: 18px 0;
}

.fig-cap {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 7px;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.fig-cap .label {
  color: var(--accent);
}

.fig-cap .note {
  font-weight: 400;
  letter-spacing: 0.04em;
  text-transform: none;
  font-size: 11px;
}

.copy {
  margin-left: auto;
  padding: 0;
  background: none;
  border: 0;
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}

.copy:hover {
  color: var(--accent);
}

.fig pre {
  margin: 0;
  padding: 14px 16px;
  background: var(--paper-2);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  overflow-x: auto;
}

.fig pre code {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.72;
  white-space: pre;
}

table.data {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12px;
}

table.data th,
table.data td {
  padding: 6px 14px 6px 0;
  border-bottom: 1px solid var(--rule-soft);
  text-align: left;
  white-space: nowrap;
}

table.data thead th {
  border-bottom: 1px solid var(--ink);
  color: var(--ink-3);
  font-weight: 400;
}

/* ------------------------------------------------------------------ misc */

.result-of {
  margin: 0 0 4px calc(2.4rem + 20px);
  font-family: var(--sans);
  font-size: 10px;
  font-style: normal;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.empty {
  max-width: var(--measure);
  padding: 60px 0;
  font-size: 17px;
  font-style: italic;
  color: var(--ink-3);
}

.colophon {
  max-width: 62rem;
  margin: 0 auto;
  padding: 0 32px 60px;
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--ink-3);
}

.colophon hr {
  height: 0;
  margin: 0 0 14px;
  border: 0;
  border-top: 1px solid var(--rule);
}

/* ------------------------------------------------------------ responsive */

@media (max-width: 900px) {
  .wrap {
    grid-template-columns: 1fr;
    gap: 32px;
    padding: 28px 22px 90px;
  }

  .contents {
    position: static;
  }

  .keys {
    display: none;
  }

  .masthead-inner {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px 22px;
  }

  .masthead-tools {
    justify-content: flex-start;
  }

  .field {
    flex-basis: 100%;
  }

  .entry-head {
    gap: 12px;
  }

  .entry-num {
    width: 1.6rem;
  }

  .entry-body,
  .entry-foot,
  .result-of {
    padding-left: 0;
    margin-left: 0;
  }

  .round-head h2 {
    font-size: 27px;
  }
}

/* ---------------------------------------------------------------- print */

@media print {
  :root {
    --paper: #fff;
    --paper-2: #f6f4ef;
    --ink: #000;
    --ink-2: #333;
    --ink-3: #666;
    --rule: #999;
    --rule-soft: #ccc;
    --accent: #000;
  }

  .masthead {
    position: static;
    box-shadow: none;
  }

  .masthead-tools,
  .contents,
  .entry-cue,
  .copy,
  .mark,
  .colophon button {
    display: none !important;
  }

  .wrap {
    display: block;
    padding: 0 0 24pt;
  }

  .entry {
    break-inside: avoid;
  }

  .round-head {
    break-after: avoid;
  }

  .prose,
  .entry-q,
  .fig,
  .round-head h2,
  .round-head p {
    max-width: none;
  }
}

</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="logo">
      <h1>QA Interview Prep</h1>
      <p>41 questions &middot; four rounds &middot; model answers</p>
    </div>
    <div class="masthead-tools">
      <div class="field">
        <input id="search" type="search" placeholder="Search every question and answer" aria-label="Search questions and answers">
      </div>
      <div class="tool-group">
        <span class="kicker">Level</span>
        <button class="tool" data-diff="all" aria-pressed="true">all</button>
        <button class="tool" data-diff="easy" aria-pressed="false">easy</button>
        <button class="tool" data-diff="mid" aria-pressed="false">medium</button>
        <button class="tool" data-diff="hard" aria-pressed="false">hard</button>
      </div>
      <div class="tool-group">
        <button class="tool" id="hide-known">hide known</button>
        <button class="tool" id="expand">expand all</button>
        <button class="tool" id="night">night</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="contents" aria-label="Contents">
    <span class="kicker">Contents</span>
    <ol id="toc"></ol>
    <p class="contents-foot" id="tally"></p>
    <div class="keys">
      <kbd>/</kbd> search &nbsp; <kbd>1</kbd>–<kbd>4</kbd> round<br>
      <kbd>e</kbd> expand all &nbsp; <kbd>n</kbd> night
    </div>
  </nav>

  <main>
    <div class="round-head" id="round-head"></div>
    <ol class="entries" id="entries"></ol>
  </main>
</div>

<footer class="colophon">
  <hr>
  Compiled 11 August 2026 &middot; answers are prompts for rehearsal, not scripts to recite &middot;
  progress is stored in this browser only.

<script>window.__ROUNDS__ = [{"id":"round-a","label":"Round A — SQL & Code Reading","desc":"Three SQL tasks and a line-by-line walkthrough of a Selenium script","questions":[{"id":"a1","q":"Retrieve all people with a specific last name who work at company \"CompanyA\".","diff":"mid","tags":["sql","join"],"table":{"caption":"employment — links people to companies","columns":["employment_id","person_id","company_name","role"],"rows":[["1","1","CompanyA","Manager"],["2","2","OtherCo","Analyst"],["3","3","CompanyA","Engineer"]]},"answer":"\u003cp>The \u003ccode>employment\u003c/code> table has no last name — it only has \u003ccode>person_id\u003c/code>. So this needs a \u003cstrong>join\u003c/strong> back to the people table (call it \u003ccode>persons\u003c/code> / \u003ccode>people\u003c/code> / \u003ccode>users\u003c/code> — say the name out loud and ask if you're unsure; interviewers like that you noticed the table wasn't given).\u003c/p>\n\u003cp>\u003cstrong>Say this first:\u003c/strong> \"I need two tables — employment gives me the company, the persons table gives me the last name. I'll join them on \u003ccode>person_id\u003c/code>.\"\u003c/p>\n\u003cp>Notes worth mentioning:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>INNER JOIN\u003c/code> is correct here — a person with no employment row shouldn't appear.\u003c/li>\n\u003cli>Filter values belong in \u003cstrong>parameters\u003c/strong> (\u003ccode>:last_name\u003c/code>), not string-concatenated — that's the SQL-injection point on a login/search form.\u003c/li>\n\u003cli>If names may differ in case or have trailing spaces: \u003ccode>WHERE LOWER(TRIM(p.last_name)) = LOWER(:last_name)\u003c/code>.\u003c/li>\n\u003cli>One person can have several employment rows — add \u003ccode>DISTINCT\u003c/code> if you only want the people, not the roles.\u003c/li>\n\u003c/ul>","solution":[{"lang":"sql","caption":"The join","src":"SELECT p.person_id,\n       p.first_name,\n       p.last_name,\n       e.company_name,\n       e.role\nFROM   persons p\nJOIN   employment e ON e.person_id = p.person_id\nWHERE  p.last_name  = 'Smith'\n  AND  e.company_name = 'CompanyA';"},{"lang":"sql","caption":"Distinct people only (person may hold several roles)","src":"SELECT DISTINCT p.person_id, p.first_name, p.last_name\nFROM   persons p\nJOIN   employment e ON e.person_id = p.person_id\nWHERE  p.last_name  = 'Smith'\n  AND  e.company_name = 'CompanyA';"}]},{"id":"a2","q":"Get all rows where draw_date is after today, from the lottery_draws table.","diff":"easy","tags":["sql","dates"],"answer":"\u003cp>\"After today\" means strictly greater than today's date. The trap is the \u003cstrong>data type\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>If \u003ccode>draw_date\u003c/code> is a \u003cstrong>DATE\u003c/strong>, \u003ccode>&gt; CURRENT_DATE\u003c/code> is exactly right.\u003c/li>\n\u003cli>If it is a \u003cstrong>DATETIME / TIMESTAMP\u003c/strong>, \u003ccode>&gt; CURRENT_DATE\u003c/code> would also return draws later \u003cem>today\u003c/em> (e.g. 20:00 tonight), because \u003ccode>CURRENT_DATE\u003c/code> is midnight. Decide which you want and say so.\u003c/li>\n\u003cli>Beware time zones — the DB server's \"today\" may not be the user's \"today\". \u003ccode>CURRENT_DATE\u003c/code> is evaluated on the server.\u003c/li>\n\u003c/ul>\n\u003cp>Also mention: \u003cstrong>don't wrap the column in a function\u003c/strong> (\u003ccode>WHERE DATE(draw_date) &gt; ...\u003c/code>) — that kills the index on \u003ccode>draw_date\u003c/code> and forces a full scan.\u003c/p>","solution":[{"lang":"sql","caption":"ANSI SQL / PostgreSQL","src":"SELECT *\nFROM   lottery_draws\nWHERE  draw_date > CURRENT_DATE\nORDER  BY draw_date ASC;"},{"lang":"sql","caption":"Dialect variants","src":"-- MySQL\nSELECT * FROM lottery_draws WHERE draw_date > CURDATE();\n\n-- SQL Server\nSELECT * FROM lottery_draws WHERE draw_date > CAST(GETDATE() AS date);\n\n-- Oracle\nSELECT * FROM lottery_draws WHERE draw_date > TRUNC(SYSDATE);\n\n-- Datetime column, want strictly tomorrow onward (Postgres)\nSELECT * FROM lottery_draws\nWHERE  draw_date >= CURRENT_DATE + INTERVAL '1 day';"}]},{"id":"a3","q":"Write a SQL query to retrieve dob for first_name = 'John' (dob = date of birth). Main table is users.","diff":"easy","tags":["sql"],"answer":"\u003cp>The simplest question in the set — the point is whether you write it cleanly and say something intelligent around it.\u003c/p>\n\u003cp>Things to add after you write it:\u003c/p>\n\u003cul>\n\u003cli>This returns \u003cstrong>one row per John\u003c/strong>, not one row. Select an identifying column too, otherwise the result is a list of dates you can't attribute to anyone.\u003c/li>\n\u003cli>Comparison is case-sensitive in some engines (Postgres) and not in others (MySQL with a \u003ccode>ci\u003c/code> collation). Use \u003ccode>UPPER()\u003c/code>/\u003ccode>ILIKE\u003c/code> if that matters.\u003c/li>\n\u003cli>In real code it would be a bound parameter, not a literal.\u003c/li>\n\u003cli>DOB is personal data — mention that in a real system access to it is restricted / masked (nice signal on a QA interview).\u003c/li>\n\u003c/ul>","solution":[{"lang":"sql","caption":"As asked","src":"SELECT dob\nFROM   users\nWHERE  first_name = 'John';"},{"lang":"sql","caption":"What you'd actually run","src":"SELECT user_id, first_name, last_name, dob\nFROM   users\nWHERE  first_name = 'John'\nORDER  BY last_name;"}]},{"id":"a4","q":"Explain every line of this Selenium WebDriver script — what is each line doing?","diff":"mid","tags":["selenium","code-reading"],"prompt":{"lang":"js","src":"const { Builder, By, Key, until } = require('selenium-webdriver');\n\n(async function example() {\n  let driver = await new Builder().forBrowser('chrome').build();\n  try {\n    await driver.get('https://www.google.com');\n    let searchBox = await driver.findElement(By.name('q'));\n    await searchBox.sendKeys('Selenium WebDriver', Key.RETURN);\n    await driver.wait(until.titleContains('Selenium WebDriver'), 5000);\n    let title = await driver.getTitle();\n    console.log('Page title is:', title);\n  } finally {\n    await driver.quit();\n  }\n})();"},"answer":"\u003cp>\u003cstrong>What the script does overall:\u003c/strong> opens Chrome, goes to Google, types \"Selenium WebDriver\" into the search box, presses Enter, waits up to 5 seconds for the page title to contain that text, prints the title, and closes the browser — whatever happened.\u003c/p>\n\u003cp>\u003cstrong>Line by line:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>\u003ccode>const { Builder, By, Key, until } = require('selenium-webdriver');\u003c/code> — imports four things from the Selenium package by destructuring: \u003ccode>Builder\u003c/code> creates the driver, \u003ccode>By\u003c/code> holds the locator strategies (\u003ccode>By.id\u003c/code>, \u003ccode>By.css\u003c/code>, \u003ccode>By.name\u003c/code>…), \u003ccode>Key\u003c/code> holds special keyboard keys (Enter, Tab, Escape), \u003ccode>until\u003c/code> holds the ready-made expected conditions used with explicit waits.\u003c/li>\n\u003cli>\u003ccode>(async function example() { … })();\u003c/code> — an \u003cstrong>IIFE\u003c/strong> (immediately-invoked function expression) declared \u003ccode>async\u003c/code>. Selenium's JS API is promise-based, so we need an async context to use \u003ccode>await\u003c/code>; the trailing \u003ccode>()\u003c/code> runs it straight away.\u003c/li>\n\u003cli>\u003ccode>let driver = await new Builder().forBrowser('chrome').build();\u003c/code> — builds the WebDriver session: \u003ccode>forBrowser('chrome')\u003c/code> picks the browser, \u003ccode>build()\u003c/code> starts ChromeDriver and launches a fresh Chrome instance. \u003ccode>driver\u003c/code> is the handle used for everything afterwards.\u003c/li>\n\u003cli>\u003ccode>try { … } finally { … }\u003c/code> — everything that can fail goes in \u003ccode>try\u003c/code>; the \u003ccode>finally\u003c/code> block runs whether the test passes or throws. This is the pattern that guarantees the browser is closed.\u003c/li>\n\u003cli>\u003ccode>await driver.get('https://www.google.com');\u003c/code> — navigates to the URL and waits for the document load event.\u003c/li>\n\u003cli>\u003ccode>let searchBox = await driver.findElement(By.name('q'));\u003c/code> — finds the first element whose \u003ccode>name\u003c/code> attribute is \u003ccode>q\u003c/code> (Google's search input) and returns a \u003cstrong>WebElement\u003c/strong> reference. If nothing matches, it throws \u003ccode>NoSuchElementError\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>await searchBox.sendKeys('Selenium WebDriver', Key.RETURN);\u003c/code> — types the text into that input and then sends the Enter key, which submits the search. Two arguments = two things typed in sequence.\u003c/li>\n\u003cli>\u003ccode>await driver.wait(until.titleContains('Selenium WebDriver'), 5000);\u003c/code> — an \u003cstrong>explicit wait\u003c/strong>: poll until the page title contains the string, giving up after 5000 ms with a \u003ccode>TimeoutError\u003c/code>. This is the synchronisation point — without it the next line could read the old title.\u003c/li>\n\u003cli>\u003ccode>let title = await driver.getTitle();\u003c/code> — reads the current page title into a variable.\u003c/li>\n\u003cli>\u003ccode>console.log('Page title is:', title);\u003c/code> — prints it. Note this is only logging — \u003cstrong>there is no assertion in this script\u003c/strong>, so strictly it's a script, not a test. Good thing to point out.\u003c/li>\n\u003cli>\u003ccode>await driver.quit();\u003c/code> — closes every window of the session and kills the ChromeDriver process, releasing the port and profile. Being in \u003ccode>finally\u003c/code> means no orphaned browsers even when a step fails.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Follow-ups they usually ask:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Why \u003ccode>quit()\u003c/code> and not \u003ccode>close()\u003c/code>?\u003c/em> — \u003ccode>close()\u003c/code> closes only the current window and leaves the session (and process) alive; \u003ccode>quit()\u003c/code> ends the whole session.\u003c/li>\n\u003cli>\u003cem>How would you improve it?\u003c/em> — add a real assertion instead of \u003ccode>console.log\u003c/code>, move the locator into a Page Object, avoid a hard-coded site, and don't mix implicit and explicit waits.\u003c/li>\n\u003cli>\u003cem>What if the element isn't found?\u003c/em> — \u003ccode>findElement\u003c/code> throws \u003ccode>NoSuchElementError\u003c/code> immediately, the \u003ccode>try\u003c/code> block aborts, \u003ccode>finally\u003c/code> still quits the driver, and the process exits with the unhandled rejection.\u003c/li>\n\u003c/ul>"}]},{"id":"round-b","label":"Round B — Full Interview","desc":"The long round: background, testing theory, test design, SQL, HTTP, automation","questions":[{"id":"b1","q":"Introduce yourself — how many years have you worked as a QA, and on what projects?","diff":"easy","tags":["intro"],"answer":"\u003cp>Keep it to \u003cstrong>60–90 seconds\u003c/strong>, in this shape:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Headline\u003c/strong> — \"I'm a QA engineer with X years, mostly in [domain: retail / fintech / e-commerce].\"\u003c/li>\n\u003cli>\u003cstrong>Two or three projects\u003c/strong>, each in one sentence: what the product did, what you owned, one concrete result. \"Checkout UI for a retail POS — I owned the regression suite, took the release smoke from 4 hours manual to 25 minutes in CI.\"\u003c/li>\n\u003cli>\u003cstrong>Current mix\u003c/strong> — manual vs automation, tooling you use daily.\u003c/li>\n\u003cli>\u003cstrong>Hand back\u003c/strong> — \"Happy to go deeper on any of those.\"\u003c/li>\n\u003c/ol>\n\u003cp>Don't recite your CV chronologically and don't list tools with no context. Numbers beat adjectives: releases per month, size of suite, size of team, bugs caught before release.\u003c/p>"},{"id":"b2","q":"What is your current project and your role in it?","diff":"easy","tags":["intro"],"answer":"\u003cp>Cover four things, briefly:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>The product\u003c/strong> — what it does and for whom, in plain language. One sentence, no internal jargon.\u003c/li>\n\u003cli>\u003cstrong>Scale / stack\u003c/strong> — web + mobile? how many users? React/Java/etc.? which environments?\u003c/li>\n\u003cli>\u003cstrong>Your role\u003c/strong> — be precise about what is \u003cem>yours\u003c/em>: test design, release sign-off, automation framework, bug triage, working with the PO on acceptance criteria.\u003c/li>\n\u003cli>\u003cstrong>Process\u003c/strong> — Scrum/Kanban, sprint length, where you sit in the flow (refinement → test cases → testing → sign-off).\u003c/li>\n\u003c/ul>\n\u003cp>Interviewers are checking scope of ownership. \"I execute test cases someone else wrote\" and \"I own the test strategy for a payment flow\" are very different answers — give the honest one, but state the part you drove.\u003c/p>"},{"id":"b3","q":"What is the structure of your team?","diff":"easy","tags":["intro","process"],"answer":"\u003cp>Give the shape of the team and where quality sits in it:\u003c/p>\n\u003cul>\n\u003cli>Size and roles — e.g. \"cross-functional squad: 1 PO, 1 designer, 4 devs (2 FE, 2 BE), 2 QA, shared architect.\"\u003c/li>\n\u003cli>Who you report to (QA lead? engineering manager?) and whether QA is embedded in the squad or a separate department. Embedded is generally the healthier answer, and you can say why: earlier involvement, shorter feedback loop.\u003c/li>\n\u003cli>Ceremonies you take part in: refinement, planning, daily, review, retro. Mention that you join refinement — that's where testability gets decided.\u003c/li>\n\u003cli>How work reaches you: ticket flow, definition of ready/done, who signs off a release.\u003c/li>\n\u003c/ul>"},{"id":"b4","q":"What kind of testing do you do — manual, automated?","diff":"easy","tags":["intro","strategy"],"answer":"\u003cp>Give a ratio and a reason, not just a label. For example: \"Roughly 60/40 manual to automated. New features are tested manually and exploratively first — that's where the interesting bugs are — then the stable, repeatable paths get automated into the regression pack that runs in CI on every merge.\"\u003c/p>\n\u003cp>Then say what you automate and what you deliberately don't:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Automate:\u003c/strong> regression, smoke, critical user journeys, data-driven checks, API-level validation, anything run on every release.\u003c/li>\n\u003cli>\u003cstrong>Keep manual:\u003c/strong> exploratory, usability, first pass on a new feature, one-off checks, anything visual/subjective, anything changing weekly.\u003c/li>\n\u003c/ul>\n\u003cp>Name your tools concretely (Playwright/Selenium/Cypress, Postman, JMeter, Jira/Xray, Jenkins/GitHub Actions).\u003c/p>"},{"id":"b5","q":"Have you done accessibility testing?","diff":"mid","tags":["accessibility"],"answer":"\u003cp>Answer honestly about depth, then show you know what it involves.\u003c/p>\n\u003cp>\u003cstrong>The standard:\u003c/strong> WCAG 2.1/2.2, levels A / AA / AAA — AA is the usual legal and contractual target (EU EN 301 549, EAA).\u003c/p>\n\u003cp>\u003cstrong>What you actually check:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Keyboard only\u003c/strong> — every control reachable with Tab, visible focus ring, logical order, no keyboard traps, Esc closes modals, focus returns where it came from.\u003c/li>\n\u003cli>\u003cstrong>Screen reader\u003c/strong> — NVDA (Windows), VoiceOver (macOS/iOS), TalkBack (Android). Do buttons announce a name and role? Are images given meaningful alt text — and decorative ones an empty alt?\u003c/li>\n\u003cli>\u003cstrong>Semantics / ARIA\u003c/strong> — real \u003ccode>&lt;button&gt;\u003c/code> over a clickable \u003ccode>&lt;div&gt;\u003c/code>; labels tied to inputs; errors linked with \u003ccode>aria-describedby\u003c/code>; live regions for async messages.\u003c/li>\n\u003cli>\u003cstrong>Colour contrast\u003c/strong> — 4.5:1 for body text, 3:1 for large text and UI components. Information never conveyed by colour alone.\u003c/li>\n\u003cli>\u003cstrong>Zoom / reflow\u003c/strong> — 200% zoom, 320 px width, no horizontal scrolling or clipped content.\u003c/li>\n\u003cli>\u003cstrong>Motion & timing\u003c/strong> — respects reduced-motion, time limits extendable.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Tools:\u003c/strong> axe DevTools, Lighthouse, WAVE, contrast checkers — plus \u003ccode>@axe-core/playwright\u003c/code> to fail the build on violations. Say clearly that automation catches maybe 30–40% of issues; keyboard and screen-reader passes are manual.\u003c/p>"},{"id":"b6","q":"Do you do functional and non-functional testing?","diff":"easy","tags":["theory"],"answer":"\u003cp>\u003cstrong>Functional\u003c/strong> — does it do what it's supposed to do? Requirements-driven: smoke, sanity, regression, integration, UAT, boundary and negative cases.\u003c/p>\n\u003cp>\u003cstrong>Non-functional\u003c/strong> — \u003cem>how well\u003c/em> does it do it? The quality attributes:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Performance\u003c/strong> — load, stress, spike, soak, scalability. Tools: JMeter, k6, Gatling.\u003c/li>\n\u003cli>\u003cstrong>Security\u003c/strong> — authn/authz, injection, session handling, OWASP Top 10.\u003c/li>\n\u003cli>\u003cstrong>Usability\u003c/strong> and \u003cstrong>accessibility\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Compatibility\u003c/strong> — browsers, OS versions, devices, screen sizes.\u003c/li>\n\u003cli>\u003cstrong>Reliability / recovery\u003c/strong> — behaviour on network loss, failover, backup-restore.\u003c/li>\n\u003cli>\u003cstrong>Maintainability, portability, localisation\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Give one real example of each from your work — e.g. \"functionally I verify the discount is applied; non-functionally I check the basket still responds under 200 concurrent users, and that the page is usable on a 5-year-old Android.\"\u003c/p>"},{"id":"b7","q":"How would you open a bug for a broken link on the login page of a mobile application?","diff":"mid","tags":["bug-reporting"],"answer":"\u003cp>They want the anatomy of a bug report. Walk through the fields:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Title\u003c/strong> — specific and searchable: \"Login screen: 'Forgot password' link opens 404 page (Android 14, app 3.2.1)\".\u003c/li>\n\u003cli>\u003cstrong>Environment\u003c/strong> — app version + build number, OS version, device model, network (WiFi/4G), environment (staging/prod), user account/role.\u003c/li>\n\u003cli>\u003cstrong>Preconditions\u003c/strong> — e.g. app freshly installed, user logged out.\u003c/li>\n\u003cli>\u003cstrong>Steps to reproduce\u003c/strong> — numbered, minimal, reproducible by a stranger.\u003c/li>\n\u003cli>\u003cstrong>Expected vs actual\u003c/strong> — \"Expected: password-reset screen opens. Actual: in-app browser shows 404 / blank screen.\"\u003c/li>\n\u003cli>\u003cstrong>Evidence\u003c/strong> — screenshot or screen recording, the actual URL the link points to, logcat/console output, the network response code (this is the bit that saves the developer an hour).\u003c/li>\n\u003cli>\u003cstrong>Severity vs priority\u003c/strong> — severity Major (a documented recovery path is dead), priority High: it's on the \u003cem>login\u003c/em> screen, so it blocks users who can't get in. Explain that severity is technical impact and priority is business urgency, and that you propose them but the team agrees them.\u003c/li>\n\u003cli>\u003cstrong>Reproducibility\u003c/strong> — always / intermittent (X out of Y attempts), and whether iOS is affected too.\u003c/li>\n\u003c/ul>\n\u003cp>Add the cross-checks you'd do \u003cem>before\u003c/em> filing: is it only that link or all links? only that OS version? does the same URL work in a desktop browser (→ backend/content issue rather than app issue)?\u003c/p>"},{"id":"b8","q":"If you test a functionality for 7 days in its web version, how long would it take you in its mobile version — less, more?","diff":"mid","tags":["mobile","estimation"],"answer":"\u003cp>There's no single right number — they're testing your reasoning. Best answer: \u003cstrong>less than 7 days for the business logic, but not trivially less, because mobile adds a whole layer the web version didn't have.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Why less:\u003c/strong> the functionality is already understood — the flows, rules, edge cases and test data have been designed once. That analysis is the expensive part and it transfers.\u003c/p>\n\u003cp>\u003cstrong>Why not much less — what's genuinely new on mobile:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Device and OS fragmentation, screen sizes and densities.\u003c/li>\n\u003cli>Interruptions: incoming call, notification, alarm, low battery, app backgrounded and killed by the OS.\u003c/li>\n\u003cli>Network: offline, flaky 3G, switching WiFi↔mobile data mid-flow.\u003c/li>\n\u003cli>Permissions: camera, location, notifications — granted, denied, revoked later.\u003c/li>\n\u003cli>Gestures, orientation, keyboard overlapping fields, safe areas/notch.\u003c/li>\n\u003cli>Install/upgrade paths, app store builds, deep links, push notifications.\u003c/li>\n\u003cli>Battery and memory consumption; slower test cycles because of builds and device setup.\u003c/li>\n\u003c/ul>\n\u003cp>So say something like: \u003cem>\"Around 3–5 days for the same functional coverage, plus extra time for the mobile-specific dimensions. And if the two apps hit the same backend, some of that risk is already covered — I'd focus mobile effort on the client-side layer.\"\u003c/em> Then add that the honest answer depends on whether it's native, hybrid or a responsive web view, and on how many devices are in scope.\u003c/p>"},{"id":"b9","q":"Application A is in production; application B is in pre-production with no documentation but the same functionality. How would you test B?","diff":"hard","tags":["strategy","exploratory"],"answer":"\u003cp>The key insight: \u003cstrong>application A becomes the specification.\u003c/strong> This is testing by comparison — an oracle problem.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Use A as the oracle.\u003c/strong> Run the same flows side by side, same test data, and compare output. Any difference is either a bug or an intentional change — take the list to the PO/dev and get each one classified. That conversation also produces the missing documentation.\u003c/li>\n\u003cli>\u003cstrong>Reverse-engineer a spec.\u003c/strong> Explore A and write down the user journeys, business rules, validations and error messages. Now you have a baseline test suite that didn't exist before.\u003c/li>\n\u003cli>\u003cstrong>Mine other sources of truth\u003c/strong> — old tickets and bug history for A (past bugs are the best regression candidates), API contracts/Swagger, DB schema, analytics on which flows users actually use, support tickets, release notes, the code itself if you can read it.\u003c/li>\n\u003cli>\u003cstrong>Risk-based prioritisation.\u003c/strong> No documentation means no time to test everything evenly. Rank by business impact × usage: money flows, login/auth, data integrity first; cosmetic pages last.\u003c/li>\n\u003cli>\u003cstrong>Exploratory testing in timeboxed sessions\u003c/strong> with a charter per session (\"explore checkout with invalid payment data to discover error-handling gaps\"), taking notes as you go. Session-based test management gives you traceability without a spec.\u003c/li>\n\u003cli>\u003cstrong>Ask humans.\u003c/strong> Devs, PO, support, and the people who used A. Fastest documentation there is.\u003c/li>\n\u003cli>\u003cstrong>Data & migration checks\u003c/strong> if B replaces A: is existing data still readable, are the accounts, history and permissions intact?\u003c/li>\n\u003cli>\u003cstrong>Write it down as you go\u003c/strong> so the next person isn't in the same position — the output of this work is both a tested app and a spec.\u003c/li>\n\u003c/ol>\n\u003cp>Also flag the risk explicitly: without documentation you can verify B \u003cem>behaves like A\u003c/em>, but you cannot verify A was correct in the first place. Say that out loud — it shows you understand the limits of the oracle.\u003c/p>"},{"id":"b10","q":"Describe the difference between unit, integration, and end-to-end testing.","diff":"easy","tags":["theory"],"answer":"\u003cp>Frame it as the \u003cstrong>test pyramid\u003c/strong>: many fast cheap tests at the bottom, few slow expensive ones at the top.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Unit\u003c/strong> — one function/class/component in isolation, dependencies mocked. Milliseconds. Written by devs, run on every save/commit. Answers: \"is this piece of logic correct?\" Example: a \u003ccode>calculateDiscount()\u003c/code> function returns 10% off for orders over 100.\u003c/li>\n\u003cli>\u003cstrong>Integration\u003c/strong> — two or more components talking to each other: service ↔ database, service ↔ API, frontend ↔ backend contract. Seconds. Answers: \"do the pieces fit together?\" Example: the order service really writes the row and the repository really reads it back.\u003c/li>\n\u003cli>\u003cstrong>End-to-end\u003c/strong> — a full user journey through the deployed system, real browser/device, real (or realistic) backend. Minutes. Answers: \"can a user actually do the thing?\" Example: log in → add to basket → pay → see the order in history.\u003c/li>\n\u003c/ul>\n\u003cp>The trade-off to state explicitly: as you go up, tests get \u003cem>more realistic\u003c/em> but \u003cem>slower, more expensive and flakier\u003c/em>, and failures point less precisely at a cause. So push each check as low as it can go, and reserve E2E for the handful of journeys that must never break.\u003c/p>"},{"id":"b11","q":"What CI/CD tools have you used?","diff":"easy","tags":["ci-cd"],"answer":"\u003cp>Name what you've really used — Jenkins, GitHub Actions, GitLab CI, Azure DevOps, Bitbucket Pipelines, CircleCI, TeamCity — then show you understand the \u003cem>pipeline\u003c/em>, which is what they're really asking:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Trigger\u003c/strong> — push, PR, merge to main, nightly schedule, manual.\u003c/li>\n\u003cli>\u003cstrong>Stages\u003c/strong> — build → static analysis/lint → unit tests → deploy to test env → API tests → E2E smoke → (gate) → deploy to staging → full regression nightly.\u003c/li>\n\u003cli>\u003cstrong>Gates\u003c/strong> — which failures block a merge. Smoke blocks; the long regression runs nightly and raises tickets instead.\u003c/li>\n\u003cli>\u003cstrong>Reporting\u003c/strong> — JUnit XML/Allure reports, screenshots and traces on failure, Slack notification to the team channel, results pushed into Jira/Xray.\u003c/li>\n\u003cli>\u003cstrong>Practical concerns\u003c/strong> — parallelisation and sharding to keep the run under ~10 minutes, test data setup/teardown, secrets handling, Docker/containers for a repeatable environment, retry policy and flake quarantine.\u003c/li>\n\u003c/ul>\n\u003cp>A concrete sentence beats a tool list: \"In GitHub Actions I set up a workflow that runs the Playwright smoke pack on every PR against a preview deployment, uploads traces as artifacts, and blocks the merge on failure.\"\u003c/p>"},{"id":"b12","q":"What is BDD?","diff":"mid","tags":["theory","process"],"answer":"\u003cp>\u003cstrong>Behaviour-Driven Development\u003c/strong> — an approach where the team defines the expected behaviour of a feature in business language \u003cem>before\u003c/em> it's built, and those examples become the tests.\u003c/p>\n\u003cp>The real point is \u003cstrong>collaboration\u003c/strong>, not the syntax: the \"three amigos\" (PO/BA, developer, tester) discuss a story together and agree concrete examples. That conversation removes ambiguity before a line of code is written — which is where most defects actually come from.\u003c/p>\n\u003cp>The examples are written in \u003cstrong>Gherkin\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode>Feature: Login\n  Scenario: Successful login with valid credentials\n    Given I am on the login page\n    When I enter a valid email and password\n    And I click \"Sign in\"\n    Then I should be taken to my dashboard\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>Given\u003c/code> = precondition, \u003ccode>When\u003c/code> = action, \u003ccode>Then\u003c/code> = expected outcome; \u003ccode>And\u003c/code>/\u003ccode>But\u003c/code> extend a step; \u003ccode>Scenario Outline\u003c/code> + \u003ccode>Examples\u003c/code> gives data-driven variants; \u003ccode>Background\u003c/code> holds shared setup.\u003c/p>\n\u003cp>Each step is bound to code (step definitions) using Cucumber, SpecFlow, Behave, JBehave, or pytest-bdd. Living documentation: the feature files stay readable by non-technical stakeholders and are executable at the same time.\u003c/p>\n\u003cp>\u003cstrong>Honest downside\u003c/strong> worth mentioning: BDD without the conversation is just a slower way to write tests — the Gherkin layer adds maintenance for no benefit if the PO never reads it. Compare with \u003cstrong>TDD\u003c/strong> (test first, developer-level, unit) and \u003cstrong>ATDD\u003c/strong> (acceptance criteria first) if asked.\u003c/p>"},{"id":"b13","q":"If the developer says that something is not a bug, what would you do?","diff":"mid","tags":["soft-skills","bug-reporting"],"answer":"\u003cp>Stay factual, never make it personal, and escalate only when needed.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Re-verify first.\u003c/strong> Reproduce on a clean environment, correct build, correct data. Sometimes the developer is right and you tested a stale build.\u003c/li>\n\u003cli>\u003cstrong>Strengthen the evidence.\u003c/strong> Video, network trace, logs, the exact request/response, the specific requirement or acceptance criterion it violates. An argument about opinions becomes a discussion about facts.\u003c/li>\n\u003cli>\u003cstrong>Talk, don't ping-pong the ticket.\u003c/strong> Five minutes at their desk / on a call beats six comment rounds. Ask why they think it's expected — often it's a genuine spec ambiguity, or it works as designed but the design is wrong.\u003c/li>\n\u003cli>\u003cstrong>Argue impact, not correctness.\u003c/strong> \"Whether or not it's a defect in the code, a user who taps this loses their basket\" — impact is the language everyone agrees on.\u003c/li>\n\u003cli>\u003cstrong>If you still disagree, escalate to the decider\u003c/strong> — the PO/BA owns \"is this the intended behaviour?\". Bring both positions neutrally.\u003c/li>\n\u003cli>\u003cstrong>Accept the decision and record it.\u003c/strong> If it's closed as \"works as designed\", the ticket keeps the rationale, and if it's a real ambiguity, get the spec/AC updated so it doesn't come back next sprint.\u003c/li>\n\u003c/ol>\n\u003cp>The signal they're looking for: you're not precious about being right, you're persistent about the user's experience, and you know who decides.\u003c/p>"},{"id":"b14","q":"For a login page with email, password, buttons and a checkbox — describe what tests you would write.","diff":"mid","tags":["test-design"],"answer":"\u003cp>Answer in \u003cstrong>categories\u003c/strong>, not a random list — that's what separates a senior answer.\u003c/p>\n\u003cp>\u003cstrong>1. Positive / happy path\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Valid email + valid password → user is logged in and lands on the right page.\u003c/li>\n\u003cli>\"Remember me\" checked → session persists after closing and reopening the browser; unchecked → it doesn't.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>2. Negative\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Valid email + wrong password; unregistered email; both fields empty; only one field filled.\u003c/li>\n\u003cli>Error message is generic (\"Invalid email or password\") — it must not reveal whether the account exists (user enumeration).\u003c/li>\n\u003cli>Deactivated / locked / unverified account.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3. Field validation\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Email format: missing @, missing domain, spaces, leading/trailing whitespace trimming, uppercase handling, plus-addressing (\u003ccode>a+b@x.com\u003c/code>), very long addresses, unicode/IDN domains.\u003c/li>\n\u003cli>Password: min/max length (boundary values: min-1, min, min+1, max, max+1), special characters, spaces, case sensitivity (it \u003cem>must\u003c/em> be case-sensitive).\u003c/li>\n\u003cli>Field-level vs form-level error display, when validation triggers (on blur / on submit), errors clear when corrected.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>4. Security\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Password field is masked, has a working show/hide toggle, and is excluded from autocomplete history where required.\u003c/li>\n\u003cli>Credentials sent over HTTPS, in the body — never in the URL/query string.\u003c/li>\n\u003cli>SQL injection (\u003ccode>' OR '1'='1\u003c/code>) and XSS (\u003ccode>&lt;script&gt;alert(1)&lt;/script&gt;\u003c/code>) payloads in both fields.\u003c/li>\n\u003cli>Brute-force protection: account lockout / rate limiting / CAPTCHA after N failures, and what the message says.\u003c/li>\n\u003cli>Session: new session ID on login, token expiry, logout invalidates it, back button after logout doesn't restore the session, no credentials in logs.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. UI / UX\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Tab order email → password → checkbox → submit; Enter submits the form.\u003c/li>\n\u003cli>Button disabled/loading state during submit; double-click doesn't fire two requests.\u003c/li>\n\u003cli>Labels, placeholders, spelling; responsive layout; password managers can fill it.\u003c/li>\n\u003cli>Links work: forgot password, register, terms.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>6. Accessibility\u003c/strong> — keyboard only, visible focus, inputs labelled, errors announced to screen readers, contrast.\u003c/p>\n\u003cp>\u003cstrong>7. Compatibility\u003c/strong> — main browsers, mobile viewport, iOS/Android.\u003c/p>\n\u003cp>\u003cstrong>8. Non-functional\u003c/strong> — response time under load, behaviour when the auth service is down (graceful error, not a hang), behaviour with no network.\u003c/p>\n\u003cp>Close by saying which of these you'd \u003cstrong>automate\u003c/strong> (happy path + main negatives + validation, data-driven) and which stay manual (usability, exploratory security).\u003c/p>"},{"id":"b15","q":"For a web page with a game for money (gambling), what tests would you write? — they show the page on screen and navigate through it.","diff":"hard","tags":["test-design","domain"],"answer":"\u003cp>This is really a \u003cstrong>risk\u003c/strong> question: real money is involved, so money and compliance come before UI polish. Structure it as follows.\u003c/p>\n\u003cp>\u003cstrong>1. Money & transactions — highest risk\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Balance is correct before/after every stake and every win; arithmetic to the correct number of decimals, correct rounding, correct currency.\u003c/li>\n\u003cli>Cannot bet more than the balance; cannot bet negative, zero, or a non-numeric amount; min/max stake boundaries.\u003c/li>\n\u003cli>Deposit and withdrawal flows, including declined cards and cancelled payments.\u003c/li>\n\u003cli>\u003cstrong>Idempotency\u003c/strong> — double-click \"Bet\", refresh mid-spin, browser back, submit the same request twice: the user must be charged exactly once.\u003c/li>\n\u003cli>\u003cstrong>Interrupted round\u003c/strong> — connection dropped after the stake was taken but before the result: on reconnect the round resolves correctly and no money vanishes. This is the classic gambling defect.\u003c/li>\n\u003cli>Concurrency: same account in two tabs/devices betting simultaneously.\u003c/li>\n\u003cli>Transaction history / statement matches the actual balance movements; backend records match what the UI showed.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>2. Game logic\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Payout table matches the rules exactly for every winning combination; edge combinations; jackpots.\u003c/li>\n\u003cli>RNG behaviour — results vary, no exploitable pattern, results come from the server and cannot be manipulated client-side.\u003c/li>\n\u003cli>Game state can't be tampered with from the browser (dev tools, altered requests, replayed responses).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3. Regulatory / responsible gambling\u003c/strong> — the part most candidates forget, and the one that scores:\u003c/p>\n\u003cul>\n\u003cli>Age verification / KYC before playing for money.\u003c/li>\n\u003cli>Geo-restrictions — blocked jurisdictions, VPN handling.\u003c/li>\n\u003cli>Deposit, loss and session limits; self-exclusion and cool-off actually block play.\u003c/li>\n\u003cli>Mandatory information visible: RTP, licence, terms, reality-check/session-time reminders.\u003c/li>\n\u003cli>Audit trail: every bet logged and traceable.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>4. Session & security\u003c/strong> — session timeout mid-game, login required, authorisation on every bet request, no sensitive data in the client, HTTPS.\u003c/p>\n\u003cp>\u003cstrong>5. Functional UI\u003c/strong> — every button and control, disabled states while a round is in progress, animations complete, sound toggle, rules/help, navigation away and back.\u003c/p>\n\u003cp>\u003cstrong>6. Non-functional\u003c/strong> — performance under concurrent players, latency effects on a timed game, load spikes, browser and mobile compatibility, orientation change, accessibility.\u003c/p>\n\u003cp>If they're navigating the page live, narrate as you go: point at each element and say what you'd verify, and ask questions (\"what's the minimum stake?\", \"what happens if I refresh here?\"). Asking good questions is part of the answer.\u003c/p>"},{"id":"b16","q":"To select the date of birth for a specific person's name from a table in a database, what query would you write?","diff":"easy","tags":["sql"],"answer":"\u003cp>Write it, then add the caveats — the caveats are the interesting part.\u003c/p>\n\u003cul>\n\u003cli>Match on first and last name if you have both; a first name alone returns many rows.\u003c/li>\n\u003cli>Use a parameter in real code, not a literal — otherwise it's an injection point.\u003c/li>\n\u003cli>Trim and normalise case if the data is user-entered.\u003c/li>\n\u003cli>DOB is personal data: in production this would be access-controlled and probably masked in test environments.\u003c/li>\n\u003c/ul>","solution":[{"lang":"sql","src":"-- simple form\nSELECT dob\nFROM   users\nWHERE  first_name = 'John';\n\n-- what you'd actually write\nSELECT user_id, first_name, last_name, dob\nFROM   users\nWHERE  first_name = :first_name\n  AND  last_name  = :last_name;\n\n-- tolerant of case / stray spaces\nSELECT dob\nFROM   users\nWHERE  LOWER(TRIM(first_name)) = LOWER(:first_name);"}]},{"id":"b17","q":"To select a name from one table and a salary from another table, what query would you write? (A join between the two tables.)","diff":"mid","tags":["sql","join"],"answer":"\u003cp>Straight \u003ccode>INNER JOIN\u003c/code> on the foreign key. What earns the points is explaining the join types:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>INNER JOIN\u003c/strong> — only rows matching in both tables. Employees without a salary row disappear.\u003c/li>\n\u003cli>\u003cstrong>LEFT JOIN\u003c/strong> — all employees, salary \u003ccode>NULL\u003c/code> where none exists. Use this when you want to \u003cem>find\u003c/em> the employees missing a salary: \u003ccode>... WHERE s.salary IS NULL\u003c/code>. That's a great data-integrity test.\u003c/li>\n\u003cli>\u003cstrong>RIGHT JOIN\u003c/strong> — the mirror image; rarely used in practice.\u003c/li>\n\u003cli>\u003cstrong>FULL OUTER JOIN\u003c/strong> — everything from both sides, useful for reconciliation.\u003c/li>\n\u003cli>\u003cstrong>CROSS JOIN\u003c/strong> — the accidental one: forget the \u003ccode>ON\u003c/code> clause and you get every combination.\u003c/li>\n\u003c/ul>\n\u003cp>Also worth saying as a tester: check the row count. If the join returns more rows than there are employees, the salary table holds multiple rows per employee (history) and you need the latest one, not all of them.\u003c/p>","solution":[{"lang":"sql","caption":"Basic join","src":"SELECT e.first_name,\n       e.last_name,\n       s.salary\nFROM   employees e\nJOIN   salaries s ON s.employee_id = e.employee_id;"},{"lang":"sql","caption":"Useful variants","src":"-- everyone, including those with no salary record\nSELECT e.first_name, e.last_name, s.salary\nFROM   employees e\nLEFT JOIN salaries s ON s.employee_id = e.employee_id;\n\n-- data-integrity check: employees missing a salary row\nSELECT e.employee_id, e.last_name\nFROM   employees e\nLEFT JOIN salaries s ON s.employee_id = e.employee_id\nWHERE  s.employee_id IS NULL;\n\n-- salary history: take only the current record\nSELECT e.last_name, s.salary\nFROM   employees e\nJOIN   salaries s ON s.employee_id = e.employee_id\nWHERE  s.end_date IS NULL;"}]},{"id":"b18","q":"With which type of request to the server is data updated?","diff":"easy","tags":["api","http"],"answer":"\u003cp>\u003cstrong>PUT\u003c/strong> and \u003cstrong>PATCH\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>PUT\u003c/strong> — full replacement of the resource. You send the whole object; fields you omit are wiped.\u003c/li>\n\u003cli>\u003cstrong>PATCH\u003c/strong> — partial update. You send only the fields that change.\u003c/li>\n\u003c/ul>\n\u003cp>For contrast: \u003cstrong>POST\u003c/strong> creates, \u003cstrong>GET\u003c/strong> reads, \u003cstrong>DELETE\u003c/strong> removes. In practice many APIs use POST for updates too — say that you check the actual API contract rather than assuming, because that's a common source of bugs.\u003c/p>"},{"id":"b19","q":"What is the difference between GET, PUT, and POST requests?","diff":"mid","tags":["api","http"],"answer":"\u003ctable class=\"cmp\">\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>GET\u003c/th>\u003cth>POST\u003c/th>\u003cth>PUT\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth>Purpose\u003c/th>\u003ctd>Read a resource\u003c/td>\u003ctd>Create a resource / submit data\u003c/td>\u003ctd>Replace a resource entirely\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Body\u003c/th>\u003ctd>No body\u003c/td>\u003ctd>Body\u003c/td>\u003ctd>Body\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Parameters\u003c/th>\u003ctd>In the URL / query string\u003c/td>\u003ctd>In the request body\u003c/td>\u003ctd>In the body, id usually in the URL\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Safe\u003c/th>\u003ctd>Yes — no server state changes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Idempotent\u003c/th>\u003ctd>Yes\u003c/td>\u003ctd>\u003cstrong>No\u003c/strong> — twice creates two resources\u003c/td>\u003ctd>\u003cstrong>Yes\u003c/strong> — same result however many times\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Cacheable\u003c/th>\u003ctd>Yes\u003c/td>\u003ctd>Generally no\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Typical success\u003c/th>\u003ctd>200\u003c/td>\u003ctd>201 Created (+ Location header)\u003c/td>\u003ctd>200 or 204 No Content\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Idempotency is the point of the question.\u003c/strong> Sending PUT five times leaves the resource in the same state; sending POST five times creates five orders. That's exactly why a double-clicked \"Pay\" button is a real defect and why you test refresh/retry behaviour on POST endpoints.\u003c/p>\n\u003cp>Also mention \u003cstrong>PATCH\u003c/strong> (partial update, not necessarily idempotent) and that GET must never change state — a \"delete\" implemented as a GET link is a genuine bug: crawlers and prefetchers will trigger it.\u003c/p>\n\u003cp>What you check as a QA on any of them: status code, response body and schema, headers, response time, authorisation (does it work without a token? with another user's token?), validation of bad input, and the actual effect in the database.\u003c/p>"},{"id":"b20","q":"On a login page, describe a condition that produces a server error and one that produces a front-end error.","diff":"mid","tags":["api","test-design"],"answer":"\u003cp>\u003cstrong>Front-end error (client-side, 4xx or no request at all):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Email in the wrong format, or a required field left empty — the form validates and shows an inline message \u003cem>without\u003c/em> ever calling the server. Nothing appears in the network tab; that's how you tell.\u003c/li>\n\u003cli>Wrong credentials → the server answers \u003cstrong>401 Unauthorized\u003c/strong>; the front end turns that into \"Invalid email or password\". The request happened, the error is expected and handled.\u003c/li>\n\u003cli>Other client-side conditions: password shorter than the minimum, unchecked mandatory terms box, malformed input rejected before submit.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Server error (5xx):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Database or auth service down → \u003cstrong>500 / 503\u003c/strong> on submitting valid credentials.\u003c/li>\n\u003cli>Unhandled exception from unexpected input — e.g. an extremely long string or special characters that break a query, an emoji in a non-unicode column, a null the code doesn't expect.\u003c/li>\n\u003cli>Timeout under load, or a dependency (SSO/identity provider) not responding → 504.\u003c/li>\n\u003c/ul>\n\u003cp>The distinction that matters: \u003cstrong>4xx = the client sent something wrong; 5xx = the server failed to handle a legitimate request.\u003c/strong> A 500 is \u003cem>always\u003c/em> a bug, even if triggered by strange input — the server should validate and return 400, not crash.\u003c/p>\n\u003cp>What you test around it: that the UI shows a friendly message instead of a raw stack trace (leaking a stack trace is a security finding), that the user can retry, that the page doesn't hang forever with a spinner, and that the failure is logged server-side. Simulate it by blocking the request or stubbing the response in dev tools — no need to take the backend down.\u003c/p>"},{"id":"b21","q":"What does this piece of code do? (Automated test with browser initialisation, one button interaction and browser close.)","diff":"mid","tags":["selenium","code-reading"],"prompt":{"lang":"js","caption":"The shape of what they usually show","src":"let driver = await new Builder().forBrowser('chrome').build();\ntry {\n  await driver.get('https://example.com/login');\n  await driver.findElement(By.id('submit')).click();\n  let msg = await driver.findElement(By.css('.message')).getText();\n  console.log(msg);\n} finally {\n  await driver.quit();\n}"},"answer":"\u003cp>Read it out loud in four beats — \u003cstrong>setup → action → verification → teardown\u003c/strong>:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Setup:\u003c/strong> a WebDriver instance is created and Chrome is launched; the driver navigates to the page under test.\u003c/li>\n\u003cli>\u003cstrong>Action:\u003c/strong> an element is located with a locator strategy (id / css / xpath / name) and clicked.\u003c/li>\n\u003cli>\u003cstrong>Check:\u003c/strong> text or state is read back from the page. Point out whether it's an \u003cem>assertion\u003c/em> or just a \u003ccode>console.log\u003c/code> — if it only logs, the test can never fail, which is the most useful observation you can make about a script like this.\u003c/li>\n\u003cli>\u003cstrong>Teardown:\u003c/strong> \u003ccode>driver.quit()\u003c/code> in a \u003ccode>finally\u003c/code> block closes the browser and ends the session regardless of what happened above.\u003c/li>\n\u003c/ol>\n\u003cp>Then add what you'd improve, which is what the question is really probing:\u003c/p>\n\u003cul>\n\u003cli>Add a real assertion (\u003ccode>expect\u003c/code>/\u003ccode>assert\u003c/code>) — logging isn't verification.\u003c/li>\n\u003cli>Replace any \u003ccode>sleep\u003c/code>/\u003ccode>Thread.sleep\u003c/code> with an explicit wait on a condition.\u003c/li>\n\u003cli>Move locators out of the test into a \u003cstrong>Page Object\u003c/strong>; the test should read as business steps.\u003c/li>\n\u003cli>Prefer stable locators — \u003ccode>data-testid\u003c/code> or id over brittle absolute XPath.\u003c/li>\n\u003cli>No hard-coded URLs, credentials or test data; keep tests independent so they can run in parallel and in any order.\u003c/li>\n\u003c/ul>"},{"id":"b22","q":"Why do we use driver.quit() at the end of an automated test?","diff":"easy","tags":["selenium"],"answer":"\u003cp>\u003ccode>driver.quit()\u003c/code> ends the entire WebDriver \u003cstrong>session\u003c/strong>: it closes all browser windows opened by the driver and shuts down the driver process itself.\u003c/p>\n\u003cp>\u003cstrong>Why it matters:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Frees resources\u003c/strong> — every abandoned browser keeps RAM, CPU and a temporary profile directory. On a CI agent running hundreds of tests, leaked instances exhaust the machine.\u003c/li>\n\u003cli>\u003cstrong>Kills the driver process\u003c/strong> — chromedriver/geckodriver keeps running and holding its port otherwise; orphaned processes accumulate until the agent needs a restart.\u003c/li>\n\u003cli>\u003cstrong>Clean state between tests\u003c/strong> — cookies, local storage and session data don't leak into the next test, so tests stay independent.\u003c/li>\n\u003cli>\u003cstrong>The build finishes\u003c/strong> — an open session can leave the process hanging.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>quit() vs close():\u003c/strong> \u003ccode>close()\u003c/code> closes only the current window; if it's the last one the browser closes but the session may linger. \u003ccode>quit()\u003c/code> terminates everything. Rule of thumb: \u003ccode>close()\u003c/code> for getting rid of one popup window, \u003ccode>quit()\u003c/code> at the end of the test.\u003c/p>\n\u003cp>\u003cstrong>Where to put it:\u003c/strong> never as the last statement of the happy path — put it in a \u003ccode>finally\u003c/code> block, or in the framework's teardown hook (\u003ccode>@AfterEach\u003c/code>, \u003ccode>afterAll\u003c/code>, a fixture), so it runs even when the test fails or throws.\u003c/p>"},{"id":"b23","q":"What is the difference between locators and assertions?","diff":"easy","tags":["automation","theory"],"answer":"\u003cp>They do completely different jobs in a test:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Locator — how you find an element.\u003c/strong> A locator is the address of something on the page: \u003ccode>By.id(\"submit\")\u003c/code>, \u003ccode>By.css(\".error-message\")\u003c/code>, \u003ccode>By.xpath(\"//button[text()='Save']\")\u003c/code>, \u003ccode>getByRole('button', { name: 'Save' })\u003c/code>. It's the \u003cem>interaction\u003c/em> half of the test: find it, click it, type into it. If a locator fails you get \u003ccode>NoSuchElementError\u003c/code> — an \u003cstrong>error\u003c/strong>, not a test failure.\u003c/li>\n\u003cli>\u003cstrong>Assertion — how you verify the result.\u003c/strong> An assertion compares actual against expected and decides pass or fail: \u003ccode>expect(message).toBe(\"Welcome\")\u003c/code>, \u003ccode>assertTrue(button.isEnabled())\u003c/code>. It's the \u003cem>verification\u003c/em> half. If an assertion doesn't hold, the test \u003cstrong>fails\u003c/strong> — which is the test doing its job.\u003c/li>\n\u003c/ul>\n\u003cp>Put simply: \u003cem>locators find, assertions judge.\u003c/em> A test with locators but no assertions isn't a test — it's a script that proves the page didn't crash. And a locator failure usually means the UI changed or the test didn't wait; an assertion failure usually means a real defect. That distinction matters when you triage a red pipeline.\u003c/p>\n\u003cp>Good practice to mention: stable locators (\u003ccode>data-testid\u003c/code>, role-based) over deep XPath; assert on user-visible outcomes rather than implementation details; one clear logical assertion per test where possible.\u003c/p>"},{"id":"b24","q":"Which tests are automated?","diff":"mid","tags":["strategy","automation"],"answer":"\u003cp>\u003cstrong>Good candidates:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Regression\u003c/strong> — run every release, never changes, boring for a human. The number one candidate.\u003c/li>\n\u003cli>\u003cstrong>Smoke / sanity\u003c/strong> — the short \"is the build worth testing?\" pack, run on every deployment.\u003c/li>\n\u003cli>\u003cstrong>Critical user journeys\u003c/strong> — login, checkout, payment: high business risk, must never break.\u003c/li>\n\u003cli>\u003cstrong>Data-driven cases\u003c/strong> — same flow, 40 combinations of input. Cheap in code, painful by hand.\u003c/li>\n\u003cli>\u003cstrong>API / integration tests\u003c/strong> — fast, stable, no UI flakiness; the best return on effort.\u003c/li>\n\u003cli>\u003cstrong>Cross-browser / cross-device\u003c/strong> repetition, and performance/load tests, which can't be done manually at all.\u003c/li>\n\u003cli>Anything needing precise setup or verification you can do in code (DB state, mocked services).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Poor candidates:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Exploratory\u003c/strong> testing — by definition unscripted.\u003c/li>\n\u003cli>\u003cstrong>Usability\u003c/strong> and visual/aesthetic judgement — a human decides \"this looks wrong\".\u003c/li>\n\u003cli>Features still \u003cstrong>changing every sprint\u003c/strong> — you'd rewrite the test more often than you run it.\u003c/li>\n\u003cli>Tests that run \u003cstrong>once\u003c/strong> (a one-off migration check) — automating costs more than doing it.\u003c/li>\n\u003cli>Flows with unautomatable dependencies: CAPTCHA, OTP by SMS, external third-party sandboxes, hardware (card readers, printers).\u003c/li>\n\u003cli>Anything with an unstable or constantly changing UI, unless you fix the locators first.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The decision rule:\u003c/strong> automate when \u003cem>frequency of execution × cost of running it manually × risk\u003c/em> outweighs the cost of writing and maintaining the test. Maintenance is the part people forget — a test suite is code, and it has an ongoing cost.\u003c/p>"},{"id":"b25","q":"How do you organise your work as a QA?","diff":"easy","tags":["process","soft-skills"],"answer":"\u003cp>Describe a real routine, not a philosophy.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Early involvement\u003c/strong> — I join refinement and review acceptance criteria before development starts; most defects are cheapest to fix as questions in a refinement session.\u003c/li>\n\u003cli>\u003cstrong>Plan per story\u003c/strong> — test cases/checklist written while dev work is ongoing, linked to the ticket in Jira/Xray/TestRail, reviewed by the dev so we agree what \"done\" means.\u003c/li>\n\u003cli>\u003cstrong>Prioritise by risk\u003c/strong> — business impact × likelihood. Payment and login before the footer. When time is short I make the trade-off explicit rather than silently cutting scope.\u003c/li>\n\u003cli>\u003cstrong>Daily rhythm\u003c/strong> — morning: check the nightly run and triage failures; then test what's ready on the board; keep the last part of the day for retesting fixes so nothing sits blocked overnight.\u003c/li>\n\u003cli>\u003cstrong>Track everything in one place\u003c/strong> — the board is the source of truth; bugs linked to stories, test runs recorded, so status is visible without anyone asking me.\u003c/li>\n\u003cli>\u003cstrong>Communicate\u003c/strong> — blockers raised in the daily, release-readiness summarised before sign-off, no surprises for the PO.\u003c/li>\n\u003cli>\u003cstrong>Reserve time for the suite\u003c/strong> — a slot each sprint for automation maintenance and flake fixing; otherwise the suite rots.\u003c/li>\n\u003cli>\u003cstrong>Retro feedback\u003c/strong> — escaped bugs get a short \"how did this get through?\" and one concrete change.\u003c/li>\n\u003c/ul>"},{"id":"b26","q":"Which are better — manual or automated tests?","diff":"easy","tags":["theory","strategy"],"answer":"\u003cp>Neither — they answer different questions, and a suite of only one of them is a broken strategy. Say that clearly, then justify it.\u003c/p>\n\u003cp>\u003cstrong>Automation is better at:\u003c/strong> repetition, speed, regression, running on every commit, large data sets, cross-browser coverage, load and performance, precision and reproducibility, and freeing people from drudgery.\u003c/p>\n\u003cp>\u003cstrong>Humans are better at:\u003c/strong> noticing what nobody specified, usability and \"this feels wrong\", exploratory testing, first pass on a new feature, ad-hoc investigation, judging visual design, and testing things that change every week.\u003c/p>\n\u003cp>The line I'd use: \u003cem>\"Automation tells me the things I already know to check still work. Manual and exploratory testing find the things nobody thought to check.\"\u003c/em> Automation confirms; humans discover.\u003c/p>\n\u003cp>Also worth adding: automation has a real cost — writing, maintaining, debugging flakes, CI infrastructure. It pays back only when the test is run many times. So the practical answer is a layered strategy: automate the repeatable regression, keep humans on the new and the uncertain.\u003c/p>"},{"id":"b27","q":"You must have had a lot of challenges in your work — how do you solve them?","diff":"mid","tags":["soft-skills","star"],"answer":"\u003cp>Give a method plus \u003cstrong>one concrete story\u003c/strong> in STAR form. The story is what they remember.\u003c/p>\n\u003cp>\u003cstrong>Method:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Understand the problem before reacting — reproduce, gather data, read the logs.\u003c/li>\n\u003cli>Separate symptom from root cause; group related failures rather than chasing each one.\u003c/li>\n\u003cli>Decide who owns the decision — I bring options and impact, the PO/lead decides on scope and risk.\u003c/li>\n\u003cli>Fix, then prevent: add a regression test or change the process so it can't recur.\u003c/li>\n\u003cli>Communicate early and in writing; surprises are the real problem, not bugs.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Example story shape:\u003c/strong> \"Our nightly suite was ~30% flaky, so the team stopped trusting it (S). I was asked to make it reliable again (T). I grouped failures by stack trace and found three root causes — hard-coded sleeps, shared test data across parallel workers, and one genuinely broken endpoint. I replaced sleeps with explicit waits, gave each worker its own seeded data, and raised a ticket for the endpoint. I quarantined the remaining flakes instead of deleting them (A). Flake rate went from 30% to under 3% in two sprints and the team started blocking merges on the suite again (R).\"\u003c/p>\n\u003cp>Have two or three of these ready: a technical one, a people/conflict one, and a deadline/pressure one.\u003c/p>"}]},{"id":"round-c","label":"Round C — SQL, Code Review, Test Design","desc":"A query, a script to critique, and two design questions about where checks belong","questions":[{"id":"c1","q":"Get all birth dates from users with the same first name from a table.","diff":"easy","tags":["sql"],"answer":"\u003cp>The literal answer is the query below — but notice the wording: \"\u003cem>all\u003c/em> birth dates from users with the \u003cem>same\u003c/em> first name\". That's a list of rows, so say what you'd add:\u003c/p>\n\u003cul>\n\u003cli>Select an identifying column as well — a bare list of dates can't be attributed to anyone.\u003c/li>\n\u003cli>\u003ccode>ORDER BY\u003c/code> so results are deterministic; without it the engine may return rows in any order, which matters if you're comparing outputs between environments.\u003c/li>\n\u003cli>If they mean \"find first names shared by more than one user\", that's a \u003ccode>GROUP BY … HAVING COUNT(*) &gt; 1\u003c/code> — worth offering, it shows you thought about the ambiguity.\u003c/li>\n\u003c/ul>","solution":[{"lang":"sql","caption":"As asked","src":"SELECT DOB\nFROM   Users\nWHERE  first_name = 'John';"},{"lang":"sql","caption":"More useful forms","src":"-- with identity and stable ordering\nSELECT user_id, first_name, last_name, DOB\nFROM   Users\nWHERE  first_name = :first_name\nORDER  BY DOB;\n\n-- first names shared by more than one user\nSELECT first_name, COUNT(*) AS people\nFROM   Users\nGROUP  BY first_name\nHAVING COUNT(*) > 1\nORDER  BY people DESC;\n\n-- everyone whose first name is shared with someone else\nSELECT u.first_name, u.last_name, u.DOB\nFROM   Users u\nJOIN  (SELECT first_name\n       FROM   Users\n       GROUP  BY first_name\n       HAVING COUNT(*) > 1) d ON d.first_name = u.first_name\nORDER  BY u.first_name;"}]},{"id":"c2","q":"Review and explain a script that opens a page, searches for an element, and asserts whether the element is present. Follow-up: what does the shown request do, and what happens if the element can't be located?","diff":"mid","tags":["code-reading","automation"],"prompt":{"lang":"js","caption":"Typical shape of what's shown","src":"await driver.get('https://example.com/products');\n\nlet banner = await driver.findElement(By.css('#promo-banner'));\
