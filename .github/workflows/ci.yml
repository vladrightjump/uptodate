name: CI + Deploy

# On push to main: run every check, and only if they all pass trigger the
# Vercel deploy (deploy hook) and verify on LIVE that the new build is really
# up. Vercel's git auto-deploy is disabled for main (vercel.json →
# git.deploymentEnabled), so a push cannot bypass the checks. A manual
# `vercel --prod` still goes around this pipeline — see CI-CD.md, which also
# documents the required secrets.

on:
  push:
    branches: [main]
  # Checks run on PRs too, so a broken pipeline is caught BEFORE the merge,
  # not after. The deploy job is limited to push (see its `if` below).
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One pipeline per branch, but never cancel a deploy that is in flight.
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Checks (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as the project's Vercel build runtime (24.x), so CI
          # cannot go green on something that dies building in production.
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --reporter=verbose

      - name: Coverage report
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      # The legacy app. No longer deployed, but still built so it cannot rot
      # unnoticed while it lives in the repo.
      - name: Build (legacy app)
        run: npm run build

      # What Vercel actually deploys — same command, same output directory.
      - name: Build the deployed site
        run: npm run build:site

      - name: Check the deployed output is complete
        run: |
          for f in qa-prep/dist/index.html \
                   qa-prep/dist/QA-Prep-standalone.html \
                   qa-prep/dist/version.json; do
            [ -s "$f" ] || { echo "::error::missing from the deploy output: $f"; exit 1; }
          done
          echo "Deploy output looks complete."

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: qa-prep/dist
          if-no-files-found: error

  qa-prep:
    name: qa-prep (typecheck + build + standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: qa-prep

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa-prep/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The same generator the root prebuild hook runs before deploying, so a
      # broken question file fails the PR rather than the deploy.
      - name: Build standalone study guide
        run: npm run standalone

      - name: Upload standalone study guide
        uses: actions/upload-artifact@v4
        with:
          name: QA-Prep-standalone
          path: qa-prep/QA-Prep-standalone.html
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel + verify live
    needs: [test, qa-prep]
    # Push to main / manual run only — a PR gets verified, not deployed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Trigger the Vercel deploy (deploy hook)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL is missing. See CI-CD.md."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy triggered for ${GITHUB_SHA:0:8}."

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify on live that the new build is up
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: ${{ vars.SITE_URL || 'https://qa-app-topaz-nine.vercel.app' }}
          TIMEOUT_MS: "300000"
        run: node scripts/check-live-deploy.mjs
